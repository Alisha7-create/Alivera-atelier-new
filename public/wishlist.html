<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Alivèra Atelier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
        body { font-family: 'Lato', sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 20px; }
        h1 { font-family: 'Cinzel', serif; color: #d4af37; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 1000px; margin: 30px auto; }
        .card { background: #121212; border: 1px solid #222; border-radius: 6px; padding: 12px; text-align: center; }
        .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; width: 100%; margin-top: 6px; }
        .back-link { display: block; text-align: center; color: #d4af37; text-decoration: none; margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>MY WISHLIST</h1>
    <div id="wishlist-container" class="grid"></div>
    <a href="/" class="back-link">&larr; Return to Storefront</a>

    <script>
        function loadWishlist() {
            const container = document.getElementById('wishlist-container');
            const wishlist = JSON.parse(localStorage.getItem('alivera_wishlist')) || [];
            
            if (wishlist.length === 0) {
                container.innerHTML = `<p style="color:#666; font-size:12px; grid-column:1/-1; text-align:center;">Your wishlist is empty.</p>`;
                return;
            }

            container.innerHTML = wishlist.map((item, index) => `
                <div class="card">
                    <img src="${item.image}" alt="${item.name}">
                    <div style="font-family:'Cinzel',serif; font-size:13px; color:#fff; margin-bottom:4px;">${item.name}</div>
                    <div style="color:#d4af37; font-size:12px; margin-bottom:8px;">₹${Number(item.price).toLocaleString('en-IN')}</div>
                    <button class="btn" onclick="moveToCart(${index})">MOVE TO BAG</button>
                    <button class="btn" style="background:transparent; color:#e74c3c; border:1px solid #e74c3c;" onclick="removeFromWishlist(${index})">REMOVE</button>
                </div>
            `).join('');
        }

        function moveToCart(index) {
            let wishlist = JSON.parse(localStorage.getItem('alivera_wishlist')) || [];
            let cart = JSON.parse(localStorage.getItem('alivera_cart')) || [];
            cart.push({ ...wishlist[index], size: 'M' });
            localStorage.setItem('alivera_cart', JSON.stringify(cart));
            wishlist.splice(index, 1);
            localStorage.setItem('alivera_wishlist', JSON.stringify(wishlist));
            loadWishlist();
            alert("Moved piece to your bag.");
        }

        function removeFromWishlist(index) {
            let wishlist = JSON.parse(localStorage.getItem('alivera_wishlist')) || [];
            wishlist.splice(index, 1);
            localStorage.setItem('alivera_wishlist', JSON.stringify(wishlist));
            loadWishlist();
        }

        window.onload = loadWishlist;
    </script>
</body>
</html>
