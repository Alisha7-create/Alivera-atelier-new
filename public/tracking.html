<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - Alivèra Atelier</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
        body { font-family: 'Lato', sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 20px; }
        h1 { font-family: 'Cinzel', serif; color: #d4af37; text-align: center; }
        .box { max-width: 500px; margin: 30px auto; background: #121212; padding: 20px; border: 1px solid #222; border-radius: 6px; }
        input { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #d4af37; color: #0a0a0a; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .back-link { display: block; text-align: center; color: #d4af37; text-decoration: none; margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>TRACK YOUR ORDER</h1>
    <div class="box">
        <input type="text" id="order-id-input" placeholder="Enter Order ID">
        <button onclick="trackOrder()">CHECK STATUS</button>
        <div id="tracking-result" style="margin-top: 15px; font-size: 12px; color: #ccc;"></div>
    </div>
    <a href="/" class="back-link">&larr; Return to Storefront</a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function trackOrder() {
            const orderId = document.getElementById('order-id-input').value.trim();
            const resultEl = document.getElementById('tracking-result');
            if (!orderId) { alert("Please input an Order ID."); return; }

            resultEl.innerHTML = "Searching records...";
            try {
                const doc = await db.collection("atelier_orders").doc(orderId).get();
                if (!doc.exists) {
                    resultEl.innerHTML = `<span style="color:#e74c3c;">Order not found. Please verify your ID.</span>`;
                    return;
                }
                const data = doc.data();
                resultEl.innerHTML = `
                    <div style="background:#0a0a0a; padding:12px; border:1px solid #333; border-radius:4px;">
                        <strong>Status:</strong> <span style="color:#d4af37; text-transform:uppercase;">${data.status}</span><br>
                        <strong>Recipient:</strong> ${data.shipping.name}<br>
                        <strong>Total:</strong> ₹${Number(data.total).toLocaleString('en-IN')}<br>
                        <strong>Destination:</strong> ${data.shipping.city} (${data.shipping.pincode})
                    </div>
                `;
            } catch (e) {
                resultEl.innerHTML = `<span style="color:#e74c3c;">Error tracking order.</span>`;
            }
        }
    </script>
</body>
</html>
