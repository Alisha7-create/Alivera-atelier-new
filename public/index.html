<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivéra Atelier – High Couture & Custom Tailoring</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="data:image/jpeg;base64,...">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #080808;
            --surface-luxury: #121212;
            --surface-card: #181818;
            --border-gold: rgba(197, 168, 128, 0.3);
            --border-gold-hover: rgba(197, 168, 128, 0.8);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-gold: #c5a880;
            --accent-gold-glow: rgba(197, 168, 128, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', Georgia, serif; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 6%;
            border-bottom: 1px solid var(--border-gold);
            background-color: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.65rem;
            letter-spacing: 6px;
            color: var(--accent-gold);
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 400;
        }
        .nav-actions { display: flex; gap: 16px; align-items: center; }
        
        .btn {
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--border-gold);
            padding: 11px 26px;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 40px;
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
        .btn:hover { background-color: var(--accent-gold-glow); border-color: var(--accent-gold); color: #fff; transform: translateY(-2px); }
        .btn-primary { background-color: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
        .btn-primary:hover { background-color: #d8bc94; color: #000; }
        .btn-gold-admin { background: linear-gradient(135deg, #d8bc94, #c5a880); color: #000; border: none; display: none; }

        .cart-icon-btn {
            background: none;
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .cart-icon-btn:hover { border-color: var(--accent-gold); background: var(--accent-gold-glow); }
        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-container { width: 100%; aspect-ratio: 1897 / 412; max-height: 412px; overflow: hidden; background: #000; border-bottom: 1px solid var(--border-gold); display: none; }
        .banner-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .countdown-bar { background: #0a0a0a; border-bottom: 1px solid var(--border-gold); text-align: center; padding: 14px; color: var(--accent-gold); font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; display: none; }

        .container { max-width: 1440px; margin: 60px auto; padding: 0 40px; flex: 1; width: 100%; }
        .input-field { width: 100%; padding: 15px 22px; background: var(--surface-luxury); border: 1px solid var(--border-gold); color: var(--text-main); font-family: inherit; font-size: 0.95rem; border-radius: 6px; outline: none; transition: border-color 0.3s; }
        .input-field:focus { border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(197, 168, 128, 0.15); }

        .collection-heading { font-size: 2.4rem; font-weight: 300; letter-spacing: 4px; margin-bottom: 40px; color: var(--text-main); border-bottom: 1px solid var(--border-gold); padding-bottom: 22px; display: flex; justify-content: space-between; align-items: baseline; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 45px; }
        .card { background-color: var(--surface-card); border: 1px solid var(--border-gold); border-radius: 6px; overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-6px); border-color: var(--border-gold-hover); }
        .product-thumb-container { width: 100%; height: 460px; background: #141414; overflow: hidden; position: relative; }
        .product-thumb-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 30px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.4rem; color: var(--text-main); margin-bottom: 10px; font-weight: 400; }
        .card-price { font-size: 1.15rem; color: var(--accent-gold); font-weight: 500; margin-bottom: 20px; }

        .select-size { width: 100%; padding: 12px 16px; background: #101010; border: 1px solid var(--border-gold); color: #fff; border-radius: 4px; font-family: inherit; font-size: 0.85rem; margin-bottom: 12px; outline: none; position: relative; z-index: 5; }
        .select-size:focus { border-color: var(--accent-gold); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface-luxury); border: 1px solid var(--border-gold); padding: 50px; width: 90%; max-width: 580px; border-radius: 8px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 26px; right: 30px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .close-modal:hover { color: var(--accent-gold); }

        #cart-drawer { position: fixed; right: -480px; top: 0; width: 460px; height: 100%; background: var(--surface-luxury); border-left: 1px solid var(--border-gold); z-index: 1100; transition: right 0.3s ease; display: flex; flex-direction: column; padding: 40px; box-shadow: -20px 0 50px rgba(0,0,0,0.9); }
        #cart-drawer.open { right: 0; }

        .account-tabs { display: flex; gap: 30px; border-bottom: 1px solid var(--border-gold); margin-bottom: 30px; padding-bottom: 2px; }
        .account-tab-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2.5px; font-weight: 600; padding-bottom: 12px; }
        .account-tab-btn.active { color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold); margin-bottom: -1px; }

        footer { text-align: center; padding: 70px 20px; border-top: 1px solid var(--border-gold); background-color: var(--surface-luxury); font-size: 0.85rem; color: var(--text-muted); margin-top: 140px; }
        footer p { margin-bottom: 12px; }
        footer a { color: var(--accent-gold); text-decoration: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <header>
        <a href="/" class="brand-title">Alivéra Atelier</a>
        <div class="nav-actions">
            <button class="cart-icon-btn" onclick="toggleCartDrawer()" title="View Shopping Cart">
                🛒
                <span id="cart-item-count" class="cart-badge">0</span>
            </button>
            <a href="/admin/index.html" id="admin-header-btn" class="btn btn-gold-admin">Admin Dashboard</a>
            <button id="account-btn" class="btn" style="display: none;" onclick="openAccountModal()">Account</button>
            <button id="auth-btn" class="btn btn-primary" onclick="openAuthModal()">Sign In</button>
        </div>
    </header>

    <!-- Promotional / Hero Banner -->
    <div id="countdown-bar" class="countdown-bar">Limited Collection Sale Commences In: <span id="timer-text">--:--:--</span></div>
    <div id="banner-wrapper" class="banner-container">
        <img id="active-banner-img" src="" alt="Alivéra Atelier Banner">
    </div>

    <div id="cart-drawer
