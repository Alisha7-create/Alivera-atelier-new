<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivéra Atelier | Storefront</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #f5f5f5;
            --accent-color: #c5a880;
            --card-bg: #1a1a1a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
        }
        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent-color);
        }
        .auth-section button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>

    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1>ALIVÉRA ATELIER</h1>
        <div class="auth-section">
            <button id="auth-btn">Sign In with Google</button>
        </div>
    </header>

    <div class="container">
        <h2>Collection</h2>
        <div id="product-grid" class="grid">
            <p>Loading collection...</p>
        </div>
    </div>

    <script>
        // Your Firebase configuration with custom authDomain
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "aliveraatelier.in",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const authBtn = document.getElementById("auth-btn");
        const productGrid = document.getElementById("product-grid");

        // Google Sign In / Out Handling
        authBtn.addEventListener("click", async () => {
            if (auth.currentUser) {
                await auth.signOut();
            } else {
                try {
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    console.error("Authentication Error:", error);
                }
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                authBtn.textContent = `Sign Out (${user.displayName || user.email})`;
            } else {
                authBtn.textContent = "Sign In with Google";
            }
        });

        // Load dresses from Firestore collection
        async function loadStorefrontDresses() {
            try {
                const snapshot = await db.collection("dresses").get();
                if (snapshot.empty) {
                    productGrid.innerHTML = "<p>No dresses found in the catalog yet.</p>";
                    return;
                }

                productGrid.innerHTML = "";
                snapshot.forEach((doc) => {
                    const dress = doc.data();
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${dress.imageUrl || dress.image || 'https://via.placeholder.com/300x350?text=Alivéra+Atelier'}" alt="${dress.name || 'Dress'}">
                        <div class="card-content">
                            <h3>${dress.name || 'Custom Garment'}</h3>
                            <div class="price">₹${dress.price || 'On Request'}</div>
                        </div>
                    `;
                    productGrid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading dresses:", error);
                productGrid.innerHTML = "<p>Error loading collection. Check console for details.</p>";
            }
        }

        document.addEventListener("DOMContentLoaded", loadStorefrontDresses);
    </script>
</body>
</html>
