<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            background: #0b0b0b; 
            color: #f5f5f5; 
        }
        header { 
            background: #000; 
            border-bottom: 1px solid #d4af37; 
            padding: 1.5rem 2rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a.brand { 
            font-size: 1.4rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            color: #d4af37; 
            text-decoration: none;
            font-weight: bold;
        }
        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        header nav a:hover { color: #d4af37; }

        .hero {
            text-align: center;
            padding: 6rem 2rem;
            background: linear-gradient(to bottom, #000, #0b0b0b);
            border-bottom: 1px solid #222;
        }
        .hero h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 1rem;
            font-weight: 300;
            text-transform: uppercase;
        }
        .hero p {
            color: #888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .btn-gold {
            display: inline-block;
            background: #d4af37;
            color: #000;
            padding: 0.9rem 2.2rem;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .btn-gold:hover { background: #e6c55c; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="brand">Alivèra Atelier</a>
        <nav>
            <a href="/">Home</a>
            <a href="/login">Sign In</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Welcome to Alivèra Atelier</h1>
        <p>Timeless Craftsmanship & Elegance</p>
        <a href="/login" class="btn-gold">Access Your Account</a>
    </div>

</body>
</html>
