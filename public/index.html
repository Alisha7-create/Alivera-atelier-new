<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Alivèra Atelier</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; }
        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        .brand-title { font-size: 18px; letter-spacing: 3px; color: #d4af37; font-weight: bold; }
        .container { max-width: 900px; margin: 50px auto; padding: 30px; background: #121212; border: 1px solid #222; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1px; text-decoration: none; transition: background 0.3s; }
        .btn:hover { background: #c59b27; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .stat-card { background: #1a1a1a; border: 1px solid #333; padding: 25px; border-radius: 6px; text-align: center; }
        .stat-card h3 { color: #d4af37; font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER</div>
        </div>
        <div>
            <button onclick="handleLogout()" class="btn" style="background: transparent; border: 1px solid #d4af37; color: #d4af37;">Sign Out</button>
        </div>
    </header>

    <div class="container">
        <!-- Private Admin Dashboard -->
        <div id="dashboard-view">
            <h1 style="color: #d4af37; letter-spacing: 2px; font-weight: normal;">Admin Dashboard</h1>
            <p style="color: #aaa;">Welcome back, Alisha. Management panel is online and secure.</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>REGISTERED USERS</h3>
                    <p style="font-size: 28px; font-weight: bold; color: #fff; margin: 0;">1</p>
                </div>
                <div class="stat-card">
                    <h3>DATABASE STATUS</h3>
                    <p style="font-size: 20px; font-weight: bold; color: #2ecc71; margin: 0;">Connected (D1)</p>
                </div>
                <div class="stat-card">
                    <h3>SECURITY</h3>
                    <p style="font-size: 20px; font-weight: bold; color: #d4af37; margin: 0;">Protected</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkSession() {
            try {
                const res = await fetch('/api/auth/session');
                const data = await res.json();

                // If not authenticated, instantly redirect to your luxury login page
                if (!data.isAuthenticated) {
                    window.location.href = '/login.html';
                }
            } catch (err) {
                window.location.href = '/login.html';
            }
        }

        async function handleLogout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        checkSession();
    </script>
</body>
</html>
