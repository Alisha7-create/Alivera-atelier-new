<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Alivera Atelier</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 0; }
        header { background: #222; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-weight: bold; font-size: 20px; color: #e50914; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; background: #222; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn { background: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn:hover { background: #b20710; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .stat-card { background: #333; padding: 20px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Alivera Atelier Admin</div>
        <div>
            <a href="/login.html" id="auth-btn" class="btn">Sign In</a>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard View (Shown when logged in) -->
        <div id="dashboard-view" class="hidden">
            <h1>Welcome, Admin!</h1>
            <p>You are successfully logged into the backend management system.</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Users Registered</h3>
                    <p style="font-size: 24px; font-weight: bold; color: #e50914;">1</p>
                </div>
                <div class="stat-card">
                    <h3>System Status</h3>
                    <p style="font-size: 24px; font-weight: bold; color: #2ecc71;">Online (D1)</p>
                </div>
                <div class="stat-card">
                    <h3>Environment</h3>
                    <p style="font-size: 24px; font-weight: bold; color: #3b82f6;">Cloudflare</p>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <button onclick="handleLogout()" class="btn" style="background: #444;">Sign Out</button>
            </div>
        </div>

        <!-- Guest View (Shown when not logged in) -->
        <div id="guest-view">
            <h2>Access Restricted</h2>
            <p>Please sign in with your administrator account to view the dashboard.</p>
            <a href="/login.html" class="btn">Go to Login</a>
        </div>
    </div>

    <script>
        // Check session state on load
        async function checkSession() {
            try {
                const res = await fetch('/api/auth/session');
                const data = await res.json();

                if (data.isAuthenticated) {
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    document.getElementById('guest-view').classList.add('hidden');
                    document.getElementById('auth-btn').innerText = 'Logout';
                    document.getElementById('auth-btn').href = '#';
                    document.getElementById('auth-btn').onclick = handleLogout;
                } else {
                    document.getElementById('dashboard-view').classList.add('hidden');
                    document.getElementById('guest-view').classList.remove('hidden');
                }
            } catch (err) {
                console.error("Session check failed");
            }
        }

        async function handleLogout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        checkSession();
    </script>
</body>
</html>
