<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alivèra Atelier</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400&display=swap');

        body { font-family: 'Lato', sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, .brand-title { font-family: 'Cinzel', serif; }

        header { background: #121212; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; position: sticky; top: 0; z-index: 1000; box-sizing: border-box; width: 100%; }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
        .logo-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; flex-shrink: 0; }
        .brand-title { font-size: 15px; letter-spacing: 2px; color: #d4af37; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .nav-btn { color: #d4af37; text-decoration: none; font-size: 10px; letter-spacing: 1.5px; border: 1px solid #d4af37; padding: 6px 10px; border-radius: 4px; white-space: nowrap; background: transparent; cursor: pointer; }
        .nav-btn:hover { background: #d4af37; color: #0a0a0a; }

        .user-avatar-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d4af37; background: #222; color: #d4af37; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-decoration: none; overflow: hidden; }

        .promo-banner { background: #d4af37; color: #0a0a0a; text-align: center; padding: 10px; font-size: 10px; letter-spacing: 1.5px; font-weight: bold; display: none; }

        .hero { text-align: center; padding: 160px 20px; background-size: cover; background-repeat: no-repeat; background-position: center; background-color: #0a0a0a; border-bottom: 1px solid #222; position: relative; }
        .hero::before { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(10,10,10,0.65); z-index: 1; }
        .hero-content { position: relative; z-index: 2; max-width: 700px; margin: 0 auto; }
        .hero h1 { color: #d4af37; font-size: 22px; letter-spacing: 3px; margin-bottom: 10px; }
        .hero p { color: #aaa; font-size: 11px; letter-spacing: 1.5px; line-height: 1.5; margin-bottom: 5px; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; flex: 1; width: 100%; box-sizing: border-box; }
        .section-title { font-size: 18px; color: #d4af37; letter-spacing: 2px; border-bottom: 1px solid #222; padding-bottom: 12px; margin-bottom: 25px; text-align: center; font-family: 'Cinzel', serif; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: #121212; border: 1px solid #222; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.3s; position: relative; }
        .product-card:hover { border-color: #d4af37; }
        
        .product-img-wrap { position: relative; width: 100%; height: 320px; cursor: pointer; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-icon-btn { position: absolute; top: 10px; background: rgba(10,10,10,0.7); border: 1px solid #d4af37; color: #d4af37; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; z-index: 5; }
        .share-btn { right: 10px; }
        .wishlist-btn { right: 50px; }
        .card-icon-btn:hover { background: #d4af37; color: #0a0a0a; }

        .product-info { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-size: 15px; color: #fff; letter-spacing: 1px; margin-bottom: 8px; font-family: 'Cinzel', serif; }
        .product-price { font-size: 13px; color: #d4af37; margin-bottom: 15px; font-weight: bold; }
        
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1.5px; text-decoration: none; font-size: 10px; text-align: center; display: block; width: 100%; box-sizing: border-box; }
        .btn-outline { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
        .btn:active { background: #c59b27; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: #121212; border: 1px solid #d4af37; padding: 25px; border-radius: 8px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-sizing: border-box; text-align: left; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #d4af37; font-size: 18px; cursor: pointer; }
        
        footer { background: #121212; border-top: 1px solid #222; text-align: center; padding: 30px 15px; color: #777; font-size: 10px; letter-spacing: 1.5px; line-height: 2.2; margin-top: auto; }
        footer a { color: #d4af37; text-decoration: none; }
        .tagline { color: #d4af37; font-style: italic; font-family: 'Cinzel', serif; font-size: 11px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="promo-banner" class="promo-banner"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER</div>
        </a>
        <div class="nav-links">
            <a href="/wishlist.html" class="nav-btn">WISHLIST</a>
            <a href="/tracking.html" class="nav-btn">TRACK ORDER</a>
            <button class="nav-btn" onclick="openCartModal()">CART (<span id="cart-count">0</span>)</button>
            <div id="nav-auth-area" style="display:inline-flex; gap:6px; align-items:center;">
                <a href="/admin/?mode=signin" class="nav-btn">SIGN IN</a>
            </div>
        </div>
    </header>

    <section id="hero-section" class="hero">
        <div class="hero-content">
            <h1 id="hero-title">Bespoke Elegance</h1>
            <p id="hero-subtitle">Handcrafted custom apparel designed for distinction.</p>
        </div>
    </section>

    <div class="container">
        <div class="section-title">THE ATELIER COLLECTION</div>
        <div id="store-catalog" class="catalog-grid">
            <p style="color: #777; font-size: 12px; text-align: center; grid-column: 1/-1;">Loading curated pieces...</p>
        </div>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProductModal()">&times;</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; align-items:start;">
                <div>
                    <img id="modal-product-img" src="" alt="Piece" style="width: 100%; height: 320px; object-fit: cover; border-radius: 4px; border: 1px solid #333;">
                    <div id="modal-stock-count" style="font-size:10px; color:#d4af37; margin-top:8px; text-transform:uppercase; letter-spacing:1px;"></div>
                </div>
                <div>
                    <h3 id="modal-product-name" style="color:#d4af37; font-size: 16px; margin-bottom: 5px; font-family:'Cinzel', serif;"></h3>
                    <div id="modal-product-price" style="color:#fff; font-size: 14px; font-weight:bold; margin-bottom: 12px;"></div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 9px; color: #aaa; letter-spacing: 1px; display:block; margin-bottom: 4px;">SELECT SIZE</label>
                        <select id="modal-size-select" style="width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 11px;">
                            <option value="Custom">Custom Measurements</option>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M" selected>M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>
                    </div>

                    <div id="modal-size-chart-wrap" style="margin-bottom: 12px; display:none;">
                        <label style="font-size: 9px; color: #d4af37; letter-spacing: 1px; display:block; margin-bottom: 4px;">ATELIER SIZE GUIDE</label>
                        <img id="modal-size-chart-img" src="" alt="Size Chart" style="width: 100%; max-height: 80px; object-fit: contain; border: 1px solid #222; border-radius: 4px;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button class="btn btn-outline" onclick="addCurrentToCart(); playSparkleSound();">ADD TO BAG</button>
                        <button class="btn" onclick="buyCurrentNow(); playSparkleSound();">BUY NOW</button>
                    </div>
                </div>
            </div>

            <hr style="border:0; border-top:1px solid #222; margin:20px 0;">

            <div style="margin-bottom:20px;">
                <h4 style="color: #d4af37; font-size: 11px; letter-spacing:1px; margin-bottom:8px; font-family:'Cinzel',serif;">QUESTIONS ASKED</h4>
                <div id="modal-questions-list" style="font-size: 11px; color: #bbb; margin-bottom:8px; max-height:90px; overflow-y:auto;">
                    <p style="color: #666; font-size:10px;">No questions asked yet.</p>
                </div>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="user-question-input" placeholder="Ask about fabric, fit, or customization..." style="flex:1; padding:6px; background:#0a0a0a; border:1px solid #333; color:#fff; border-radius:4px; font-size:11px;">
                    <button class="btn" style="width: auto; padding: 6px 12px; font-size:9px;" onclick="submitProductQuestion()">ASK</button>
                </div>
            </div>

            <div>
                <h4 style="color: #d4af37; font-size: 11px; letter-spacing:1px; margin-bottom:8px; font-family:'Cinzel',serif;">REVIEWS & RATINGS</h4>
                <div id="modal-reviews-list" style="font-size: 11px; color: #bbb; margin-bottom:12px; max-height:110px; overflow-y:auto;">
                    <p style="color: #666; font-size:10px;">No reviews yet.</p>
                </div>
                <div style="background:#0a0a0a; padding:10px; border:1px solid #222
