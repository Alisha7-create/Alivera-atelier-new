<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Bespoke Haute Couture</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #050505; color: #f5f5f4;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(191, 149, 63, 0.2); }
        h1 { font-family: 'Playfair Display', Georgia, serif; color: #fcf6ba; font-size: 26px; margin: 0; letter-spacing: 2px; }
        
        /* Store Grid (Matches your original layout) */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin-top: 30px; }
        .product-card { background: #0c0a09; border: 1px solid rgba(191, 149, 63, 0.3); padding: 14px; text-align: center; }
        .product-thumb { width: 100%; height: 320px; object-fit: cover; cursor: pointer; border: 1px solid rgba(191,149,63,0.2); }
        .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 15px; color: #fcf6ba; margin: 10px 0 4px 0; cursor: pointer; }
        .card-price { font-size: 14px; color: #f5f5f4; font-weight: bold; margin-bottom: 8px; }
        .size-chart-link { font-size: 11px; color: #bf953f; background: none; border: none; text-decoration: underline; cursor: pointer; margin-bottom: 10px; display: block; width: 100%; text-align: center; }
        
        .card-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .btn-cart, .btn-buy { flex: 1; padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; cursor: pointer; border: 1px solid #bf953f; }
        .btn-cart { background: transparent; color: #fcf6ba; }
        .btn-buy { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #050505; border: none; }

        /* Amazon/Flipkart Style Full Detail Modal */
        #productModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: #0c0a09; border: 1px solid #bf953f; max-width: 700px; margin: 30px auto; padding: 24px; position: relative; color: #f5f5f4; }
        .close-modal { position: absolute; top: 12px; right: 18px; background: none; border: none; color: #fcf6ba; font-size: 28px; cursor: pointer; }
        
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 600px) { .modal-grid { grid-template-columns: 1fr; } }
        
        .modal-img-wrap { position: relative; overflow: hidden; cursor: zoom-in; border: 1px solid rgba(191,149,63,0.3); }
        .modal-img { width: 100%; height: 350px; object-fit: cover; transition: transform 0.3s ease; }
        
        .modal-size-chart-img { width: 100%; max-height: 150px; object-fit: contain; margin-top: 10px; border: 1px dashed rgba(191,149,63,0.4); background: #000; }
        
        .dropdown-select, .input-text { width: 100%; background: #050505; border: 1px solid rgba(191,149,63,0.4); color: #fff; padding: 8px; font-size: 12px; margin-top: 6px; margin-bottom: 12px; }
        .wishlist-btn { background: none; border: 1px solid #bf953f; color: #fcf6ba; width: 100%; padding: 8px; font-size: 12px; cursor: pointer; margin-top: 8px; text-transform: uppercase; }

        /* Reviews Section */
        .reviews-section { margin-top: 20px; border-top: 1px solid rgba(191,149,63,0.3); padding-top: 14px; }
        .review-item { background: #050505; padding: 10px; border: 1px solid rgba(191,149,63,0.2); margin-bottom: 8px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ALIVÈRA ATELIER</h1>
            <div style="font-size: 9px; color: #a8a29e; text-transform: uppercase; letter-spacing: 3px; margin-top: 4px;">Bespoke Haute Couture</div>
        </header>

        <!-- STOREFRONT GRID (Matches your layout) -->
        <div class="store-grid" id="storeGrid"></div>
    </div>

    <!-- PRODUCT DETAIL POPUP MODAL -->
    <div id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-grid">
                <div>
                    <!-- Zoomable Dress Image -->
                    <div class="modal-img-wrap" onclick="toggleZoom(this)">
                        <img id="modalDressImg" src="" alt="Dress" class="modal-img">
                        <div style="font-size: 9px; text-align: center; color: #a8a29e; padding: 4px;">Tap image to zoom</div>
                    </div>
                    <!-- Size Chart Image Preview -->
                    <div style="font-size: 11px; color: #fcf6ba; margin-top: 10px;">Size Chart Reference:</div>
                    <img id="modalSizeChartImg" src="" alt="Size Chart" class="modal-size-chart-img">
                </div>

                <div>
                    <h2 id="modalTitle" style="font-family: 'Playfair Display', serif; color: #fcf6ba; font-size: 18px; margin: 0 0 6px 0;"></h2>
                    <div id="modalPrice" style="font-size: 16px; font-weight: bold; margin-bottom: 12px;"></div>

                    <!-- Size Selection Dropdown -->
                    <label style="font-size: 11px; color: #fcf6ba; text-transform: uppercase;">Select Size / Custom Option:</label>
                    <select id="sizeDropdown" class="dropdown-select" onchange="handleSizeChange(this)">
                        <option value="XS">XS (Bust 32" | Waist 26")</option>
                        <option value="S">S (Bust 34" | Waist 28")</option>
                        <option value="M" selected>M (Bust 36" | Waist 30")</option>
                        <option value="L">L (Bust 38" | Waist 32")</option>
                        <option value="XL">XL (Bust 40" | Waist 34")</option>
                        <option value="Custom">Custom Sized (Provide Measurements)</option>
                    </select>

                    <div id="customMeasurementsBox" style="display: none;">
                        <input type="text" placeholder="Enter your Bust, Waist, Hips (Inches)" class="input-text" id="customNotes">
                    </div>

                    <!-- Action Buttons -->
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <button class="btn-cart" onclick="addToBagFromModal()">Add to Bag</button>
                        <button class="btn-buy" onclick="buyNowFromModal()">Buy Now</button>
                    </div>
                    <button class="wishlist-btn" onclick="toggleWishlist()">♡ Add to Wishlist</button>
                </div>
            </div>

            <!-- RATINGS & REVIEWS SECTION (Starts clean, no fake reviews) -->
            <div class="reviews-section">
                <h3 style="font-family: 'Playfair Display', serif; color: #fcf6ba; font-size: 13px; margin: 0 0 8px 0;">Client Ratings & Verified Reviews</h3>
                <div id="reviewsContainer" style="font-size: 11px; color: #888; margin-bottom: 12px;">No reviews yet. Be the first client to review this bespoke piece.</div>

                <!-- Submit Review Form -->
                <div style="background: #050505; padding: 10px; border: 1px solid rgba(191,149,63,0.3);">
                    <div style="font-size: 11px; color: #fcf6ba; margin-bottom: 4px;">Leave Your Review</div>
                    <select id="reviewRating" class="dropdown-select" style="margin-bottom: 6px;">
                        <option value="★★★★★">★★★★★ (5/5 - Absolute Perfection)</option>
                        <option value="★★★★☆">★★★★☆ (4/5 - Excellent)</option>
                        <option value="★★★☆☆">★★★☆☆ (3/5 - Good)</option>
                    </select>
                    <input type="text" id="reviewAuthor" placeholder="Your Name" class="input-text" style="margin-bottom: 6px;">
                    <input type="text" id="reviewText" placeholder="Write your experience..." class="input-text" style="margin-bottom: 6px;">
                    <button onclick="submitReview()" style="background: #fcf6ba; color: #050505; border: none; padding: 6px 12px; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Submit Review</button>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Store Catalog Data (Images, Titles, Prices, Size Chart references)
        const products = [
            { id: 1, name: "Midnight Orchid with overskirt", price: 4500, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 2, name: "The Forest Flare Dress", price: 5200, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 3, name: "Rose Petal Crop Top", price: 1600, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 4, name: "Sunset Bespoke Dress", price: 4500, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 5, name: "Emerald Pearl Dress", price: 5500, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 6, name: "The White Lily Dress", price: 2200, image: "favicon.ico.png", sizeChart: "favicon.ico.png" },
            { id: 7, name: "Lavender Light Top", price: 1800, image: "favicon.ico.png", sizeChart: "favicon.ico.png" }
        ];

        let currentActiveProduct = null;
        // In-memory store for reviews per product ID
        let productReviews = {};

        // Render Storefront Grid
        const grid = document.getElementById('storeGrid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}" class="product-thumb" onclick="openProductModal(${p.id})">
                    <div class="card-title" onclick="openProductModal(${p.id})">${p.name}</div>
                    <div class="card-price">₹${p.price}</div>
                    <button class="size-chart-link" onclick="openProductModal(${p.id})">VIEW SIZE CHART</button>
                    <div class="card-buttons">
                        <button class="btn-cart" onclick="quickAction('Added ${p.name} to Bag')">ADD TO BAG</button>
                        <button class="btn-buy" onclick="quickAction('Proceeding to Checkout for ${p.name}')">BUY NOW</button>
                    </div>
                </div>
            `;
        });

        function openProductModal(id) {
            currentActiveProduct = products.find(item => item.id === id);
            document.getElementById('modalDressImg').src = currentActiveProduct.image;
            document.getElementById('modalDressImg').style.transform = 'scale(1)';
            document.getElementById('modalSizeChartImg').src = currentActiveProduct.sizeChart;
            document.getElementById('modalTitle').innerText = currentActiveProduct.name;
            document.getElementById('modalPrice').innerText = `₹${currentActiveProduct.price}`;
            
            renderReviewsForCurrentProduct();
            document.getElementById('productModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function toggleZoom(container) {
            const img = container.querySelector('img');
            img.style.transform = img.style.transform === 'scale(1.7)' ? 'scale(1)' : 'scale(1.7)';
        }

        function handleSizeChange(select) {
            const customBox = document.getElementById('customMeasurementsBox');
            customBox.style.display = select.value === 'Custom' ? 'block' : 'none';
        }

        function toggleWishlist() {
            alert(`✓ Added "${currentActiveProduct.name}" to your Atelier Wishlist.`);
        }

        function addToBagFromModal() {
            const size = document.getElementById('sizeDropdown').value;
            alert(`Added ${currentActiveProduct.name} (Size: ${size}) to your Shopping Bag.`);
            closeModal();
        }

        function buyNowFromModal() {
            const size = document.getElementById('sizeDropdown').value;
            alert(`Initializing secure checkout for ${currentActiveProduct.name} in Size: ${size}.`);
            closeModal();
        }

        function quickAction(msg) {
            alert(msg);
        }

        function submitReview() {
            const author = document.getElementById('reviewAuthor').value.trim();
            const text = document.getElementById('reviewText').value.trim();
            const rating = document.getElementById('reviewRating').value;

            if (!author || !text) {
                alert('Please enter your name and review text.');
                return;
            }

            if (!productReviews[currentActiveProduct.id]) {
                productReviews[currentActiveProduct.id] = [];
            }

            productReviews[currentActiveProduct.id].push({ author, text, rating });
            document.getElementById('reviewAuthor').value = '';
            document.getElementById('reviewText').value = '';
            renderReviewsForCurrentProduct();
        }

        function renderReviewsForCurrentProduct() {
            const container = document.getElementById('reviewsContainer');
            const reviews = productReviews[currentActiveProduct.id] || [];

            if (reviews.length === 0) {
                container.innerHTML = 'No reviews yet. Be the first client to review this bespoke piece.';
                return;
            }

            container.innerHTML = '';
            reviews.forEach(r => {
                container.innerHTML += `
                    <div class="review-item">
                        <div style="display: flex; justify-content: space-between; color: #fcf6ba; margin-bottom: 2px;">
                            <strong>${r.author}</strong>
                            <span>${r.rating}</span>
                        </div>
                        <div style="color: #d6d3d1;">${r.text}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
