<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Luxury Custom Apparel</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/app-splash.css">
</head>
<body>
    <!-- Top Navigation / Bag Count Bar -->
    <header class="site-header">
        <a href="/" class="logo">Alivèra Atelier</a>
        <div class="nav-right">
            <span id="productCount">Loading...</span>
            <button onclick="openBag()" class="bag-toggle-btn">Bag (<span id="bagCount">0</span>)</button>
        </div>
    </header>

    <!-- Main Store Catalog Section -->
    <main class="main-content">
        <section class="hero-intro">
            <h1>Artisanal Ready-to-Wear & Custom Tailoring</h1>
            <p>Crafted individually in our studio for a precise, luxurious drape.</p>
        </section>

        <!-- Product Catalog Container -->
        <div id="products" class="products-grid">
            <!-- Products are injected dynamically via public/app.js -->
        </div>
    </main>

    <!-- Slide-out Shopping Bag Drawer -->
    <div id="backdrop" class="backdrop" onclick="closeBag()"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h2>Your Shopping Bag</h2>
            <button onclick="closeBag()" class="close-btn">×</button>
        </div>
        <div id="bagItems" class="drawer-items">
            <!-- Bag items injected here -->
        </div>
        <div class="drawer-footer">
            <div class="bag-total-row">
                <span>Total:</span>
                <strong id="bagTotal">₹0</strong>
            </div>
            <button id="checkoutBtn" class="btn dark full">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Product Detail / Checkout Modal Overlay -->
    <div id="checkout" class="modal-overlay">
        <div id="checkoutBody" class="modal-content">
            <!-- Dynamic product view or checkout form injected here -->
        </div>
    </div>

    <!-- Size Chart Modal Overlay -->
    <div id="sizeChartModal" class="modal-overlay" onclick="closeSizeChart()">
        <div class="modal-content chart-modal" onclick="event.stopPropagation()">
            <button class="close" onclick="closeSizeChart()">×</button>
            <div id="chartBody"></div>
        </div>
    </div>

    <!-- Load Assets mapping & Application script -->
    <script src="/assets.js"></script>
    <script src="/app.js"></script>
</body>
</html>
