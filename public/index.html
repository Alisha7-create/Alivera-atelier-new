<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Alivèra Atelier</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            background: #0b0b0b; 
            color: #f5f5f5; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        header { 
            background: #000; 
            border-bottom: 1px solid #d4af37; 
            padding: 1.5rem 2rem; 
            text-align: center;
        }
        header a { 
            font-size: 1.4rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            color: #d4af37; 
            text-decoration: none;
            font-weight: bold;
        }

        .auth-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem 1.5rem; 
        }

        .auth-card { 
            background: #141414; 
            border: 1px solid #262626; 
            border-radius: 4px; 
            padding: 3rem 2.5rem; 
            max-width: 420px; 
            width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .logo-container img {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
        }

        .auth-title { 
            text-align: center; 
            font-size: 1.5rem; 
            font-weight: 300; 
            letter-spacing: 2px; 
            margin-bottom: 2rem; 
            color: #fff; 
            text-transform: uppercase; 
        }

        .input-group { margin-bottom: 1.5rem; }
        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            color: #aaa; 
            margin-bottom: 0.5rem; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }
        .input-group input { 
            width: 100%; 
            background: #0b0b0b; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 0.85rem 1rem; 
            border-radius: 2px; 
            font-size: 1rem; 
            outline: none;
        }
        .input-group input:focus { border-color: #d4af37; }

        .btn-submit { 
            width: 100%; 
            background: #d4af37; 
            color: #000; 
            padding: 1rem; 
            border: none; 
            border-radius: 2px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            cursor: pointer; 
            margin-top: 1rem;
        }
        .btn-submit:hover { background: #e6c55c; }
    </style>
</head>
<body>

    <header>
        <a href="/">Alivèra Atelier</a>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="logo-container">
                <img src="/logo.png.png" alt="Alivèra Atelier Logo">
            </div>

            <div>
                <h2 class="auth-title">Sign In</h2>
                <form id="signin-form">
                    <div class="input-group">
                        <label for="signin-email">Email Address</label>
                        <!-- Notice placeholder only shows an email format example, never a password -->
                        <input type="email" id="signin-email" required placeholder="name@example.com">
                    </div>
                    <div class="input-group">
                        <label for="signin-password">Password</label>
                        <!-- type="password" ensures characters are hidden as dots/bullets -->
                        <input type="password" id="signin-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                alert('Network error or server issue');
            }
        });
    </script>
</body>
</html>
