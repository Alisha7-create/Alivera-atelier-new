<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Haute Couture & Bespoke Apparel</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400&display=swap');

        body { font-family: 'Lato', sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, .brand-title { font-family: 'Cinzel', serif; }

        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        .brand-title { font-size: 18px; letter-spacing: 3px; color: #d4af37; font-weight: bold; }
        
        .promo-banner { background: #d4af37; color: #0a0a0a; text-align: center; padding: 10px; font-size: 11px; letter-spacing: 2px; font-weight: bold; display: none; }

        .hero { text-align: center; padding: 80px 20px; background: linear-gradient(rgba(10,10,10,0.8), rgba(10,10,10,0.8)), url('/logo.png') center/cover no-repeat; border-bottom: 1px solid #222; }
        .hero h1 { color: #d4af37; font-size: 32px; letter-spacing: 5px; margin-bottom: 15px; }
        .hero p { color: #aaa; font-size: 14px; letter-spacing: 2px; max-width: 600px; margin: 0 auto; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .section-title { font-size: 20px; color: #d4af37; letter-spacing: 3px; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 30px; text-align: center; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #121212; border: 1px solid #222; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.3s; }
        .product-card:hover { border-color: #d4af37; }
        .product-img { width: 100%; height: 360px; object-fit: cover; }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-size: 16px; color: #fff; letter-spacing: 1.5px; margin-bottom: 10px; font-family: 'Cinzel', serif; }
        .product-price { font-size: 14px; color: #d4af37; margin-bottom: 20px; font-weight: bold; }
        
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1.5px; text-decoration: none; font-size: 11px; text-align: center; display: block; width: 100%; box-sizing: border-box; transition: background 0.2s; }
        .btn:hover { background: #c59b27; }
        
        footer { background: #121212; border-top: 1px solid #222; text-align: center; padding: 30px; color: #777; font-size: 11px; letter-spacing: 1.5px; }
        footer a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>

    <div id="promo-banner" class="promo-banner"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER</div>
        </a>
        <a href="/admin/" style="color: #d4af37; text-decoration: none; font-size: 11px; letter-spacing: 2px; border: 1px solid #d4af37; padding: 8px 15px; border-radius: 4px;">CLIENT PORTAL</a>
    </header>

    <section class="hero">
        <h1>BESPOKE HAUTE COUTURE</h1>
        <p>HANDCRAFTED SILKS & CUSTOM DRAPES TAILORED TO PERFECTION</p>
    </section>

    <div class="container">
        <div class="section-title">THE ATELIER COLLECTION</div>
        <div id="store-catalog" class="catalog-grid">
            <p style="color: #777; font-size: 13px; text-align: center; grid-column: 1/-1;">Loading curated pieces...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 ALIVÈRA ATELIER. ALL RIGHTS RESERVED. | <a href="/admin/">CLIENT SIGN IN / PORTAL</a>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadStorefront() {
            try {
                const promoDoc = await db.collection("atelier_settings").doc("promo").get();
                if (promoDoc.exists) {
                    const data = promoDoc.data();
                    if (data.bannerText) {
                        const banner = document.getElementById('promo-banner');
                        banner.innerText = data.bannerText;
                        banner.style.display = 'block';
                    }
                }

                const catalogEl = document.getElementById('store-catalog');
                const snapshot = await db.collection("atelier_products").orderBy("createdAt", "desc").get();
                
                if (snapshot.empty) {
                    catalogEl.innerHTML = `<p style="color: #777; font-size: 13px; text-align: center; grid-column: 1/-1;">New collection arriving shortly.</p>`;
                    return;
                }

                catalogEl.innerHTML = snapshot.docs.map(doc => {
                    const p = doc.data();
                    return `
                        <div class="product-card">
                            <img src="${p.image}" alt="${p.name}" class="product-img">
                            <div class="product-info">
                                <div class="product-name">${p.name}</div>
                                <div class="product-price">₹${Number(p.price).toLocaleString('en-IN')}</div>
                                <button class="btn" onclick="initiateOrder('${doc.id}', '${p.name}', ${p.price})">ACQUIRE PIECE</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error loading storefront:", e);
            }
        }

        async function initiateOrder(id, name, price) {
            const clientEmail = prompt("Please enter your email address for order confirmation & fitting updates:");
            if (!clientEmail) return;

            const selectedSize = prompt("Select Size (Custom, XS, S, M, L, XL):", "M");
            if (!selectedSize) return;

            try {
                await db.collection("atelier_orders").add({
                    productId: id,
                    itemName: name,
                    itemPrice: price,
                    clientEmail: clientEmail.trim(),
                    selectedSize: selectedSize.trim(),
                    status: "Pending Payment/Confirmation",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Order request registered successfully! You can sign into the Client Portal anytime with this email to track your fitting status.");
            } catch (e) {
                alert("Error placing order: " + e.message);
            }
        }

        loadStorefront();
    </script>
</body>
</html>
