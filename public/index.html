<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Luxury Collection</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        .brand-title { font-size: 18px; letter-spacing: 3px; color: #d4af37; font-weight: bold; }
        
        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .nav-link { color: #aaa; text-decoration: none; font-size: 12px; letter-spacing: 1px; cursor: pointer; background: none; border: none; font-family: inherit; }
        .nav-link:hover { color: #d4af37; }

        /* Promo Banner Announcement Bar */
        #promo-banner { background: #d4af37; color: #0a0a0a; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; letter-spacing: 2px; display: none; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        .hero-section { text-align: center; margin-bottom: 50px; }
        .hero-section h1 { color: #d4af37; letter-spacing: 4px; font-size: 28px; margin-bottom: 10px; }
        .hero-section p { color: #aaa; letter-spacing: 2px; font-size: 12px; font-style: italic; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .store-card { background: #121212; border: 1px solid #222; border-radius: 8px; padding: 15px; text-align: center; transition: border-color 0.3s; }
        .store-card:hover { border-color: #d4af37; }
        .store-card img { width: 100%; height: 320px; object-fit: contain; background: #0a0a0a; border-radius: 6px; margin-bottom: 15px; border: 1px solid #1a1a1a; }
        .product-title { font-size: 14px; font-weight: bold; color: #fff; letter-spacing: 1px; margin-bottom: 8px; }
        .product-price { color: #d4af37; font-size: 14px; letter-spacing: 1px; margin-bottom: 15px; }
        
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1px; text-decoration: none; font-size: 12px; width: 100%; display: block; box-sizing: border-box; margin-top: 8px; }
        .btn:hover { background: #c59b27; }

        .btn-google { background: #fff; color: #333; border: 1px solid #ddd; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f1f1; }

        /* Modal Overlays */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #121212; border: 1px solid #d4af37; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; border-radius: 8px; padding: 30px; box-sizing: border-box; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; color: #aaa; font-size: 20px; cursor: pointer; background: none; border: none; }
        .close-modal:hover { color: #d4af37; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; color: #aaa; letter-spacing: 1.5px; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 12px; box-sizing: border-box; }

        .divider { text-align: center; border-bottom: 1px solid #222; line-height: 0.1em; margin: 20px 0; font-size: 10px; color: #777; letter-spacing: 1px; }
        .divider span { background: #121212; padding: 0 10px; }

        footer { background: #121212; border-top: 1px solid #222; padding: 30px 20px; text-align: center; margin-top: auto; }
        .footer-brand { color: #d4af37; font-size: 14px; letter-spacing: 3px; font-weight: bold; margin-bottom: 8px; }
        .footer-tagline { color: #aaa; font-size: 11px; letter-spacing: 1.5px; margin-bottom: 15px; font-style: italic; }
        .footer-copy { color: #666; font-size: 10px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Dynamic Promotional Banner -->
    <div id="promo-banner"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER</div>
        </a>
        <div class="nav-actions">
            <button class="nav-link" id="auth-nav-btn" onclick="openAuthModal()">SIGN IN / REGISTER</button>
            <button class="nav-link" onclick="openCartModal()">CART</button>
        </div>
    </header>

    <div class="container">
        <div class="hero-section">
            <h1>THE LUXURY COLLECTION</h1>
            <p>Beautiful. The way you are</p>
        </div>

        <div class="catalog-grid" id="storefront-catalog-grid">
            <p style="color: #777; text-align: center; width: 100%;">Loading the collection...</p>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL (Sign In & Create Account with Google option) -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAuthModal()">&times;</button>
            <h2 id="auth-modal-title" style="color: #d4af37; margin-top: 0; font-size: 18px; letter-spacing: 2px;">CLIENT SIGN IN</h2>
            
            <button class="btn btn-google" onclick="signInWithGoogle()">
                <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.39l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continue with Google
            </button>

            <div class="divider"><span>OR EMAIL</span></div>

            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="auth-email" class="form-control" placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
            </div>

            <button class="btn" id="auth-submit-btn" onclick="handleAuthAction()">Sign In</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <button class="nav-link" id="auth-toggle-mode" onclick="toggleAuthMode()">New to Atelier? Create an Account</button>
            </div>
        </div>
    </div>

    <!-- CART MODAL -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCartModal()">&times;</button>
            <h2 style="color: #d4af37; margin-top: 0; font-size: 18px; letter-spacing: 2px;">YOUR SHOPPING BAG</h2>
            <div id="cart-items-container">
                <p style="color: #777; font-size: 12px;">Your bag is empty.</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-brand">ALIVÈRA ATELIER</div>
        <div class="footer-tagline">Beautiful. The way you are</div>
        <div class="footer-copy">&copy; 2026 Alivèra Atelier. All rights reserved.</div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let isRegisterMode = false;

        // Modal Controls
        function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
        function openCartModal() { document.getElementById('cart-modal').style.display = 'flex'; }
        function closeCartModal() { document.getElementById('cart-modal').style.display = 'none'; }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-modal-title').innerText = isRegisterMode ? 'CREATE NEW ACCOUNT' : 'CLIENT SIGN IN';
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Register Account & Claim 10% Welcome Offer' : 'Sign In';
            document.getElementById('auth-toggle-mode').innerText = isRegisterMode ? 'Already have an account? Sign In' : 'New to Atelier? Create an Account';
        }

        // Google Sign-In Handler
        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                // Check if user profile doc exists, if not create it for first-time tracking
                const userRef = db.collection("atelier_users").doc(result.user.uid);
                const userDoc = await userRef.get();
                if (!userDoc.exists) {
                    await userRef.set({
                        email: result.user.email,
                        hasClaimedWelcomeDiscount: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                alert("Successfully signed in with Google!");
                closeAuthModal();
            } catch (error) {
                alert("Google Sign-In error: " + error.message);
            }
        }

        // Email/Password Authentication Handler
        async function handleAuthAction() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                alert("Please enter both your email and password.");
                return;
            }

            try {
                if (isRegisterMode) {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection("atelier_users").doc(userCred.user.uid).set({
                        email: email,
                        hasClaimedWelcomeDiscount: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("Account created successfully! You are eligible for a 10% first-time customer discount on your first order.");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    alert("Signed in successfully!");
                }
                closeAuthModal();
            } catch (error) {
                alert("Authentication error: " + error.message);
            }
        }

        // Monitor Auth State for Header Updates
        auth.onAuthStateChanged(user => {
            const navBtn = document.getElementById('auth-nav-btn');
            if (user) {
                navBtn.innerText = "MY ACCOUNT (" + (user.displayName || user.email.split('@')[0]) + ")";
                navBtn.onclick = () => { 
                    if(confirm("Sign out of your account?")) { auth.signOut(); } 
                };
            } else {
                navBtn.innerText = "SIGN IN / REGISTER";
                navBtn.onclick = openAuthModal;
            }
        });

        // Load Products & Promotional Rules
        async function loadStorefrontData() {
            const grid = document.getElementById('storefront-catalog-grid');
            if (!grid) return;

            try {
                const promoDoc = await db.collection("atelier_settings").doc("promo").get();
                if (promoDoc.exists) {
                    const pData = promoDoc.data();
                    const bannerEl = document.getElementById('promo-banner');
                    if(pData.bannerText) {
                        bannerEl.innerText = pData.bannerText;
                        bannerEl.style.display = 'block';
                    } else {
                        bannerEl.style.display = 'none';
                    }
                }

                const snapshot = await db.collection("atelier_products").orderBy("createdAt", "desc").get();
                if (snapshot.empty) {
                    grid.innerHTML = `<p style="color: #777; text-align: center; width: 100%;">New luxury collections coming soon.</p>`;
                    return;
                }

                grid.innerHTML = snapshot.docs.map(doc => {
                    const p = doc.data();
                    return `
                        <div class="store-card">
                            <img src="${p.image}" alt="${p.name}" onerror="this.src='/logo.png'">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">₹${Number(p.price).toLocaleString('en-IN')}</div>
                            <button class="btn" onclick="alert('Proceeding to checkout for ${p.name.replace(/'/g, "\\'")}')">Acquire Piece</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error("Error loading store data:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStorefrontData();
        });
    </script>
</body>
</html>
