<!DOCTYPE html>
<html lang="en">

    <title>Alivéra Atelier – High Couture & Custom Tailoring</title>

        :root {

            --text-main: #ffffff;
            --text-muted: #aaaaaa;

        * { box-sizing: border-box; margin: 0; padding: 0; }

            background-color: var(--bg-obsidian);

            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

        h1, h2, h3, .serif-font { font-family: 'Playfair Display', Georgia, serif; }
        
        header {

            justify-content: space-between;

            padding: 28px 6%;

            position: sticky;
            top: 0;
            z-index: 100;

        .brand-title {

            text-transform: uppercase;
            text-decoration: none;
            font-weight: 400;

        .nav-actions { display: flex; gap: 16px; align-items: center; }
        
        .btn {

            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 40px;
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
        .btn:hover { background-color: var(--accent-gold-glow); border-color: var(--accent-gold); color: #fff; transform: translateY(-2px); }

        .btn-gold-admin { background: linear-gradient(135deg, #d8bc94, #c5a880); color: #000; border: none; display: none; }

        .cart-icon-btn {

            height: 44px;

            transition: all 0.3s ease;

        .cart-icon-btn:hover { border-color: var(--accent-gold); background: var(--accent-gold-glow); }

            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .countdown-bar { background: #0a0a0a; border-bottom: 1px solid var(--border-gold); text-align: center; padding: 14px; color: var(--accent-gold); font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; display: none; }

        .container { max-width: 1440px; margin: 60px auto; padding: 0 40px; flex: 1; width: 100%; }
        .input-field { width: 100%; padding: 15px 22px; background: var(--surface-luxury); border: 1px solid var(--border-gold); color: var(--text-main); font-family: inherit; font-size: 0.95rem; border-radius: 6px; outline: none; transition: border-color 0.3s; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 45px; }

        .product-thumb-container { width: 100%; height: 460px; background: #141414; overflow: hidden; position: relative; }

        .card-content { padding: 30px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.4rem; color: var(--text-main); margin-bottom: 10px; font-weight: 400; }
        .card-price { font-size: 1.15rem; color: var(--accent-gold); font-weight: 500; margin-bottom: 20px; }
