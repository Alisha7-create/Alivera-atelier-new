<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivéra Atelier – High Couture & Custom Tailoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #080808;
            --surface-luxury: #121212;
            --surface-card: #181818;
            --border-gold: rgba(197, 168, 128, 0.3);
            --border-gold-hover: rgba(197, 168, 128, 0.8);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-gold: #c5a880;
            --accent-gold-glow: rgba(197, 168, 128, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', Georgia, serif; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 6%;
            border-bottom: 1px solid var(--border-gold);
            background-color: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.65rem;
            letter-spacing: 6px;
            color: var(--accent-gold);
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 400;
        }
        .nav-actions { display: flex; gap: 16px; align-items: center; }
        
        .btn {
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--border-gold);
            padding: 11px 26px;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 40px;
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
        .btn:hover { background-color: var(--accent-gold-glow); border-color: var(--accent-gold); color: #fff; transform: translateY(-2px); }
        .btn-primary { background-color: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
        .btn-primary:hover { background-color: #d8bc94; color: #000; }
        .btn-gold-admin { background: linear-gradient(135deg, #d8bc94, #c5a880); color: #000; border: none; display: none; }

        .cart-icon-btn {
            background: none;
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .cart-icon-btn:hover { border-color: var(--accent-gold); background: var(--accent-gold-glow); }
