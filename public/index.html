<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Luxury Custom Apparel</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f5f5f4; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: rgba(191, 149, 63, 0.3); }
        .gold-bg { background-color: #bf953f; }
        .gold-hover:hover { background-color: #d4af37; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="antialiased selection:bg-amber-400 selection:text-black">

    <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b gold-border">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="font-serif text-2xl tracking-[0.25em] font-bold gold-gradient">ALIVÉRA ATELIER</a>
            <div class="flex items-center space-x-6">
                <a href="admin/index.html" class="text-[10px] uppercase tracking-widest text-stone-500 hover:text-amber-400 transition hidden md:inline-block">Admin Portal</a>
                <div id="nav-profile-container">
                    <button type="button" onclick="openAuthModal()" class="text-xs uppercase tracking-[0.15em] font-medium text-stone-300 hover:text-amber-300 transition">Sign In</button>
                </div>
                <button type="button" onclick="openCartModal()" class="relative text-xs uppercase tracking-[0.15em] font-medium hover:text-amber-300 transition flex items-center gap-2">
                    <span>Bag</span>
                    <span id="cart-badge" class="gold-bg text-black text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-6 py-8">
        <div class="relative w-full aspect-[1897/412] bg-stone-900 border gold-border overflow-hidden flex items-center justify-center shadow-2xl">
            <img id="hero-banner-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
            
            <div class="relative z-10 text-center px-6">
                <div id="banner-status-display" class="font-serif text-2xl md:text-4xl font-light gold-gradient tracking-widest uppercase"></div>
            </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-12">
        <div class="text-center mb-12">
            <h2 class="font-serif text-3xl font-light tracking-wide mb-2 gold-gradient">Bespoke Collection</h2>
            <p class="text-stone-400 text-xs tracking-[0.2em] uppercase">Hand-tailored from XS to 3XL or Crafted to Your Exact Measurements</p>
        </div>
        <div id="storefront-products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8"></div>
    </main>

    <div id="checkout-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-stone-950 border gold-border w-full max-w-2xl p-8 shadow-2xl relative text-stone-100 my-8">
            <button type="button" onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-stone-400 text-xs uppercase">Close</button>
            <h3 class="font-serif text-2xl font-medium gold-gradient mb-6">Secure Atelier Checkout</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="chk-name" placeholder="Full Name" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                    <input type="text" id="chk-phone" placeholder="Phone Number" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                </div>
                <textarea id="chk-address" placeholder="Full Street Address..." class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none h-20 resize-none"></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <input type="text" id="chk-pincode" placeholder="6-digit Pincode" onblur="checkPincode()" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                        <span id="pin-status" class="text-[10px] mt-1 block"></span>
                    </div>
                    <select class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none"><option>Razorpay Secure Gateway</option></select>
                </div>
                <button type="button" onclick="submitOrder()" class="w-full gold-bg text-black py-4 text-xs uppercase tracking-widest font-semibold gold-hover mt-4">Confirm & Pay (24h Cancellation Window)</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="bg-stone-950 border gold-border w-full max-w-md p-8 relative text-stone-100">
            <button type="button" onclick="closeAuthModal()" class="absolute top-4 right-4 text-stone-400 text-xs">Close</button>
            <h3 class="font-serif text-2xl font-medium gold-gradient mb-6">Client Portal</h3>
            <input type="email" id="auth-email" placeholder="Email Address" class="w-full bg-stone-900 border gold-border p-3 text-xs mb-4 text-stone-100 outline-none">
            <input type="password" id="auth-password" placeholder="Password" class="w-full bg-stone-900 border gold-border p-3 text-xs mb-4 text-stone-100 outline-none">
            <button type="button" onclick="loginUser()" class="w-full gold-bg text-black py-3 text-xs uppercase font-semibold">Sign In</button>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 hidden flex justify-end">
        <div class="bg-stone-950 border-l gold-border w-full max-w-md h-full flex flex-col p-6 overflow-y-auto text-stone-100">
            <div class="flex justify-between pb-6 border-b border-stone-900"><h3 class="font-serif text-xl text-amber-200">Shopping Bag</h3><button onclick="closeCartModal()" class="text-xs">Close</button></div>
            <div id="cart-items" class="flex-grow py-6 space-y-4 overflow-y-auto"></div>
            <div class="border-t border-stone-900 pt-6 mt-auto">
                <div class="flex justify-between mb-6 text-stone-100"><span>Total</span><span id="cart-total" class="text-amber-300">₹0</span></div>
                <button type="button" onclick="openCheckoutModal()" class="w-full gold-bg text-black py-4 text-xs uppercase font-semibold">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let cart = JSON.parse(localStorage.getItem('alivera_cart')) || [];
        let currentUser = null;

        auth.onAuthStateChanged(user => { currentUser = user; });

        async function loginUser() {
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-password').value);
                closeAuthModal();
            } catch(e) { alert(e.message); }
        }

        async function loadStorefront() {
            const grid = document.getElementById('storefront-products-grid');
            const snap = await db.collection("atelier_dresses").orderBy("createdAt", "desc").get();
            if(snap.empty) { grid.innerHTML = `<p class="text-stone-500 text-xs col-span-2 text-center py-8">No dresses published yet.</p>`; return; }
            grid.innerHTML = snap.docs.map(doc => {
                const item = doc.data();
                return `
                    <div class="bg-stone-950 border gold-border p-4 flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="aspect-[3/4] bg-stone-900 mb-3 overflow-hidden border gold-border"><img src="${item.imageUrl}" class="w-full h-full object-cover"></div>
                            <h4 class="font-serif text-sm text-amber-200 mb-1">${item.name}</h4>
                            <p class="text-xs text-stone-400 mb-3">₹${item.price}</p>
                        </div>
                        <select id="size-${doc.id}" class="w-full bg-stone-900 border gold-border text-stone-200 p-2 text-[11px] uppercase outline-none mb-2">
                            <option value="S">S</option><option value="M" selected>M</option><option value="L">L</option><option value="CUSTOM">Custom Measurements</option>
                        </select>
                        <button type="button" onclick="addToCart('${item.name}', ${item.price}, '${doc.id}')" class="w-full gold-bg text-black py-2.5 text-[10px] uppercase font-semibold gold-hover">Add to Bag</button>
                    </div>
                `;
            }).join('');
        }

        db.collection("atelier_settings").doc("promotion_config").onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                if (data.bannerImageUrl) {
                    document.getElementById('hero-banner-img').src = data.bannerImageUrl;
                }
                manageBannerStates(data.saleStartTimestamp, data.saleEndTimestamp, data.saleActive, data.saleType, data.saleCap);
            }
        });

        let timerInterval = null;
        function manageBannerStates(startMs, endMs, isActive, saleType, saleCap) {
            const statusEl = document.getElementById('banner-status-display');
            if (timerInterval) clearInterval(timerInterval);

            if (!isActive || !startMs || !endMs) {
                statusEl.innerText = "";
                return;
            }

            timerInterval = setInterval(async () => {
                const now = new Date().getTime();

                if (now > endMs || !isActive) {
                    statusEl.innerText = "";
                    clearInterval(timerInterval);
                    return;
                }

                if (saleType === 'fcfs' && saleCap) {
                    const ordersSnap = await db.collection("atelier_orders").get();
                    if (ordersSnap.size >= Number(saleCap)) {
                        statusEl.innerText = "SOLD OUT";
                        clearInterval(timerInterval);
                        return;
                    }
                }

                if (now >= startMs && now <= endMs) {
                    statusEl.innerText = "SALE LIVE";
                } else if (now < startMs) {
                    const distance = startMs - now;
                    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((distance % (1000 * 60)) / 1000);
                    statusEl.innerText = `Starts in: ${d}d ${h}h ${m}m ${s}s`;
                }
            }, 1000);
        }

        function addToCart(name, price, id) {
            const size = document.getElementById(`size-${id}`).value;
            cart.push({ name, price, size });
            localStorage.setItem('alivera_cart', JSON.stringify(cart));
            updateCartUI();
            alert("Added to your shopping bag!");
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.length;
            const container = document.getElementById('cart-items');
            let total = 0;
            if (cart.length === 0) { container.innerHTML = `<p class="text-stone-500 text-xs text-center py-8">Your bag is empty</p>`; document.getElementById('cart-total').innerText = '₹0'; return; }
            container.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `<div class="bg-stone-900 p-3 border gold-border flex justify-between items-center text-xs"><div><span class="font-medium text-amber-200">${item.name}</span><p class="text-stone-400 text-[10px]">Size: ${item.size} • ₹${item.price}</p></div><button onclick="cart.splice(${idx},1);localStorage.setItem('alivera_cart',JSON.stringify(cart));updateCartUI();" class="text-red-400">Remove</button></div>`;
            }).join('');
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function checkPincode() {
            const pin = document.getElementById('chk-pincode').value;
            const st = document.getElementById('pin-status');
            if(pin.length === 6) { st.innerText = "✓ Delivery available"; st.className = "text-[10px] text-emerald-400 mt-1 block"; }
            else { st.innerText = "Enter valid 6-digit pincode"; st.className = "text-[10px] text-amber-400 mt-1 block"; }
        }

        async function submitOrder() {
            const name = document.getElementById('chk-name').value.trim();
            const phone = document.getElementById('chk-phone').value.trim();
            const address = document.getElementById('chk-address').value.trim();
            const pincode = document.getElementById('chk-pincode').value.trim();

            if(!name || !phone || !address || !pincode || cart.length === 0) { alert("Please complete your shipping details."); return; }

            await db.collection("atelier_orders").add({
                clientName: name, clientEmail: currentUser ? currentUser.email : 'guest@aliveraatelier.in',
                phone, address: `${address} - Pincode: ${pincode}`, items: cart, status: 'Pending Review',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Order placed successfully! 24-hour cancellation window applies.");
            cart = []; localStorage.removeItem('alivera_cart'); updateCartUI(); closeCheckoutModal();
        }

        function openCheckoutModal() { document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }
        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function openCartModal() { document.getElementById('cart-modal').classList.remove('hidden'); updateCartUI(); }
        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }

        document.addEventListener('DOMContentLoaded', loadStorefront);
    </script>
</body>
</html>
