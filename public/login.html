<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/api/brand/logo">
  <link rel="apple-touch-icon" href="/api/brand/logo">
  <title>Sign In — Alivèra Atelier</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nav .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-family: serif;
      letter-spacing: 1.5px;
      color: inherit;
    }
    .nav .brand img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
<header class="nav">
  <a class="brand" href="/">
    <img src="/api/brand/logo" alt="Alivèra Atelier">
    <span>ATELIER</span>
  </a>
  <a href="/">← Return home</a>
</header>
<main class="auth section">
  <div class="authbox">
    <p class="eyebrow">WELCOME BACK</p>
    <h1 class="checkouttitle">Sign in to your account</h1>
    <form id="loginForm" style="margin-top: 24px;">
      <div class="field" style="margin-bottom: 16px;">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="field" style="margin-bottom: 20px;">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn dark full" type="submit">Sign In</button>
      <p id="errorMsg" class="muted" style="color:#b91c1c;margin-top:12px;text-align:center;font-size:13px;"></p>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;" class="muted">
      Don't have an account? <a href="/signup" style="color:var(--text);text-decoration:underline;">Create one</a>
    </p>
  </div>
</main>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Invalid email or password.';
      return;
    }
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/account';
    location.href = next;
  } catch {
    errorMsg.textContent = 'Connection error. Please try again.';
  }
};
</script>
</body>
</html>
