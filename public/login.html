<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivera Atelier - Sign Up</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="auth-container">
        <h2>Create an Account</h2>
        
        <!-- Sign-Up Form -->
        <form id="signup-form">
            <div class="form-group">
                <label for="signup-name">Name</label>
                <input type="text" id="signup-name" placeholder="Your Name" required />
            </div>
            
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Your Email" required />
            </div>
            
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="At least 8 characters" required />
            </div>
            
            <button type="submit" id="signup-btn">Sign Up</button>
        </form>

        <p id="error-message" class="error-text" style="color: red; display: none;"></p>
    </div>

    <!-- Link your frontend JavaScript file -->
    <script src="/js/script.js"></script>
</body>
</html>    <p class="eyebrow">WELCOME BACK</p>
    <h1 class="checkouttitle">Sign in to your account</h1>
    <form id="loginForm" style="margin-top: 24px;">
      <div class="field" style="margin-bottom: 16px;">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="field" style="margin-bottom: 20px;">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn dark full" type="submit">Sign In</button>
      <p id="errorMsg" class="muted" style="color:#b91c1c;margin-top:12px;text-align:center;font-size:13px;"></p>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;" class="muted">
      Don't have an account? <a href="/signup" style="color:var(--text);text-decoration:underline;">Create one</a>
    </p>
  </div>
</main>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Invalid email or password.';
      return;
    }
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/account';
    location.href = next;
  } catch {
    errorMsg.textContent = 'Connection error. Please try again.';
  }
};
</script>
</body>
</html>
