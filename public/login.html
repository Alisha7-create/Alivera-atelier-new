<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #222; padding: 30px; border-radius: 8px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b20710; }
        .hidden { display: none; }
        .toggle-link { text-align: center; margin-top: 15px; cursor: pointer; color: #3b82f6; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Sign In Section -->
        <div id="signin-section">
            <h2>Sign In</h2>
            <form id="signin-form">
                <input type="email" id="signin-email" placeholder="Email" required>
                <input type="password" id="signin-password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <div class="toggle-link" onclick="toggleForms()">Need an account? Sign Up</div>
        </div>

        <!-- Sign Up Section -->
        <div id="signup-section" class="hidden">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>
            <div class="toggle-link" onclick="toggleForms()">Already have an account? Sign In</div>
        </div>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('signin-section').classList.toggle('hidden');
            document.getElementById('signup-section').classList.toggle('hidden');
        }

        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Sign-in button clicked!");

            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            try {
                console.log("Sending fetch to /api/auth/login...");
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                console.log("Response status:", res.status);
                const data = await res.json();
                console.log("Response data:", data);

                if (res.ok && data.success) {
                    alert('Success! Redirecting...');
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error("Fetch catch error:", err);
                alert('Network error: ' + err.message);
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Sign up failed');
                }
            } catch (err) {
                alert('Network error during sign up.');
            }
        });
    </script>
</body>
</html>
