<script>
    function toggleForms() {
        document.getElementById('signin-section').classList.toggle('hidden');
        document.getElementById('signup-section').classList.toggle('hidden');
    }

    // Sign In Request Handler
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = '/';
            } else {
                alert(data.error || 'Login failed');
            }
        } catch (err) {
            console.error('Login fetch error:', err);
            alert('Server error: Could not connect to the authentication service.');
        }
    });

    // Sign Up Request Handler
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = '/';
            } else {
                alert(data.error || 'Sign up failed');
            }
        } catch (err) {
            console.error('Signup fetch error:', err);
            alert('Server error: Could not connect to the registration service.');
        }
    });
</script>
