<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Alivèra Atelier</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .top-brand { width: 100%; text-align: center; padding: 25px 0; border-bottom: 1px solid #d4af37; color: #d4af37; font-size: 20px; letter-spacing: 4px; font-weight: bold; }
        .login-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; padding: 40px 0; }
        .card { background: #121212; border: 1px solid #222; padding: 45px 40px; border-radius: 4px; width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.9); text-align: center; }
        .logo-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; box-shadow: 0 0 20px rgba(212,175,55,0.4); margin-bottom: 25px; }
        h2 { color: #f5f5f5; letter-spacing: 3px; font-size: 22px; margin-bottom: 35px; font-weight: normal; }
        .input-group { text-align: left; margin-bottom: 22px; }
        label { display: block; font-size: 10px; color: #aaa; letter-spacing: 1.5px; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; background: #f0f4f8; border: 1px solid #ccc; color: #111; border-radius: 3px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #d4af37; outline: none; }
        button { width: 100%; padding: 14px; background: #d4af37; color: #0a0a0a; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; letter-spacing: 2px; margin-top: 15px; transition: background 0.3s; font-size: 13px; }
        button:hover { background: #c59b27; }
        .back-link { display: inline-block; margin-top: 25px; color: #888; font-size: 11px; text-decoration: none; letter-spacing: 1px; }
        .back-link:hover { color: #d4af37; }
    </style>
</head>
<body>
    <div class="top-brand">ALIVÈRA ATELIER</div>
    <div class="login-wrapper">
        <div class="card">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h2>SIGN IN</h2>
            <form id="signin-form">
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="signin-email" value="hello@aliveraatelier.in" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="signin-password" value="••••••••" required>
                </div>
                <button type="submit">SIGN IN</button>
            </form>
            <a href="/" class="back-link">← Return to Storefront</a>
        </div>
    </div>
    <script>
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: document.getElementById('signin-password').value })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = '/admin/';
            } else {
                alert(data.error || 'Invalid credentials');
            }
        });
    </script>
</body>
</html>
