<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Alivèra Atelier</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #121212; border: 1px solid #d4af37; padding: 40px; border-radius: 8px; width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); text-align: center; }
        .logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.3); margin-bottom: 15px; }
        h2 { color: #d4af37; letter-spacing: 2px; font-size: 20px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #d4af37; outline: none; }
        button { width: 100%; padding: 12px; background: #d4af37; color: #0a0a0a; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1px; margin-top: 15px; transition: background 0.3s; }
        button:hover { background: #c59b27; }
        .back-link { display: block; margin-top: 20px; color: #888; font-size: 12px; text-decoration: none; letter-spacing: 1px; }
        .back-link:hover { color: #d4af37; }
    </style>
</head>
<body>

    <div class="card">
        <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h2>SIGN IN</h2>
        <form id="signin-form">
            <input type="email" id="signin-email" placeholder="Email Address" required>
            <input type="password" id="signin-password" placeholder="Password" required>
            <button type="submit">SIGN IN</button>
        </form>
        <a href="/" class="back-link">← Return to Storefront</a>
    </div>

    <script>
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    // Successfully authenticated — redirect straight to your secure admin folder
                    window.location.href = '/admin/';
                } else {
                    alert(data.error || 'Invalid administrator credentials.');
                }
            } catch (err) {
                alert('Network connection error.');
            }
        });
    </script>
</body>
</html>
