<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="/api/brand/logo"><link rel="apple-touch-icon" href="/api/brand/logo"><title>Alivèra Atelier — Owner Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/">ALIVÈRA <span>ATELIER</span></a><a href="/">← Store</a></header><main class="section"><p class="eyebrow">OWNER DASHBOARD</p><h1 style="font:500 50px 'Playfair Display';margin-top:0">Your atelier, at a glance.</h1><div id="adminApp"><p>Loading dashboard…</p></div></main><script>const A='/api/admin';let editing=null,editingStory={};async function call(path,opt={}){const r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Please sign in as the owner.');return j}async function load(){try{const [p,o,s,c]=await Promise.all([call('/products'),call('/orders'),call('/stories'),call('/campaigns')]);document.getElementById('adminApp').innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:35px"><button class="btn dark" onclick="newProduct()">+ Add product</button><button class="btn" style="border:1px solid var(--line);background:#fff" onclick="load()">Refresh</button></div><section style="margin-bottom:55px"><h2 style="font:500 32px 'Playfair Display'">Products (${p.length})</h2><div style="overflow:auto;background:#fff"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="padding:14px;text-align:left">Product</th><th>Price</th><th>Image</th><th>Chart</th><th>Active</th><th></th></tr>${p.map(x=>`<tr style="border-top:1px solid var(--line)"><td style="padding:14px">${esc(x.name)}</td><td>₹${x.price}</td><td>${x.image_url && !String(x.image_url).startsWith('pending-')?'✓':'Missing'}</td><td>${x.size_chart_url?'✓':'Built-in'}</td><td>${x.active?'Yes':'No'}</td><td><button onclick='editProduct(${JSON.stringify(x)})'>Edit</button> <button onclick='deleteProduct("${x.id}")'>Delete</button></td></tr>`).join('')}</table></div></section><section style="margin-bottom:55px"><h2 style="font:500 32px 'Playfair Display'">Customer Stories (${s.length})</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px">${s.map(x=>`<article style="background:#fff;padding:12px"><img src="${esc(x.image_url)}" style="width:100%;aspect-ratio:4/5;object-fit:cover"><b style="display:block;margin-top:10px">${esc(x.customer_name)}</b><small>${esc(x.product_name||'')}</small><p style="font-size:12px;color:#777">${esc(x.caption||'')}</p><button onclick='editStory(${JSON.stringify(x)})'>Edit</button> <button onclick='deleteStory("${x.id}")'>Delete</button></article>`).join('')}</div><button class="btn dark" style="margin-top:18px" onclick="newStory()">+ Post customer story</button></section><section style="margin-bottom:55px"><div style="display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap"><div><p class="eyebrow">SPECIAL OCCASIONS</p><h2 style="font:500 32px 'Playfair Display';margin:0">Launches & discounts (${c.length})</h2></div><button class="btn dark" onclick="newCampaign()">+ Create campaign</button></div><p style="color:#777;font-size:13px;max-width:700px">Create a special-occasion launch, promo code or limited offer. You control the discount, start/end dates, total uses and uses per customer.</p><div style="display:grid;gap:12px;margin-top:18px">${c.map(x=>`<article style="background:#fff;padding:20px;border:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><b>${esc(x.title)}</b><p style="font-size:12px;color:#777;margin:5px 0">${esc(x.description||'')}</p></div><strong>${esc(x.code)}</strong></div><p style="font-size:12px">${x.discount_type==='percent'?esc(x.discount_value)+'% off':'₹'+esc(x.discount_value)+' off'}${Number(x.min_subtotal)>0?' · Min ₹'+esc(x.min_subtotal):''} · Used ${x.used_count||0}${x.max_uses?' / '+x.max_uses:''}${x.max_uses_per_customer?' · '+x.max_uses_per_customer+' per customer':''}</p><p style="font-size:12px;color:#777">${x.starts_at?'Starts '+new Date(x.starts_at).toLocaleString():'Starts now'} · ${x.ends_at?'Ends '+new Date(x.ends_at).toLocaleString():'No end date'} · ${x.active?'Active':'Paused'}</p><button onclick='editCampaign(${JSON.stringify(x)})'>Edit</button> <button onclick='deleteCampaign("${x.id}")'>Delete</button></article>`).join('')}</div></section><section><h2 style="font:500 32px 'Playfair Display'">Orders (${o.length})</h2><div style="display:grid;gap:12px">${o.map(x=>`<article style="background:#fff;padding:20px"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><b>${esc(x.order_number)}</b><strong>₹${x.total}</strong></div><p style="font-size:12px;color:#777">${esc(x.customer_name)} · ${esc(x.email)} · ${esc(x.phone)}<br>${esc(x.address)}, ${esc(x.city)}, ${esc(x.state)} ${esc(x.pincode)}</p><p>${(x.items||[]).map(i=>`${esc(i.name)} · ${esc(i.size)} × ${i.quantity}${i.custom_fit?' · custom fit':''}`).join('<br>')}</p><select onchange='updateOrder("${x.id}",this.value)' style="padding:8px"><option ${x.status==='placed'?'selected':''}>placed</option><option ${x.status==='confirmed'?'selected':''}>confirmed</option><option ${x.status==='processing'?'selected':''}>processing</option><option ${x.status==='shipped'?'selected':''}>shipped</option><option ${x.status==='delivered'?'selected':''}>delivered</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></article>`).join('')}</div></section>`}catch(e){document.getElementById('adminApp').innerHTML=`<div style="background:#fff;padding:30px"><h3>Owner access required</h3><p>${esc(e.message)}</p><a class="btn dark" href="/login?next=/admin/">Sign in</a></div>`}}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function newProduct(){editing={};form()}function editProduct(x){editing=x;form()}function form(){document.getElementById('productForm')?.remove();document.getElementById('adminApp').insertAdjacentHTML('afterbegin',`<div id="productForm" style="background:#fff;padding:25px;margin-bottom:35px"><h2 style="font:500 30px 'Playfair Display'">${editing.id?'Edit':'Add'} product</h2><div class="formgrid"><div class="field"><label>Name</label><input id="pn" value="${esc(editing.name||'')}"></div><div class="field"><label>Price</label><input id="pp" type="number" value="${editing.price||0}"></div><div class="field"><label>Stock</label><input id="ps" type="number" value="${editing.stock||0}"></div><div class="field"><label>Sizes (comma separated)</label><input id="pz" value="${(editing.sizes||['XS','S','M','L','XL','XXL']).join(',')}"></div><div class="field wide"><label>Product photo</label><input id="pfile" type="file" accept="image/*"><input id="pi" value="${esc(editing.image_url||'')}" placeholder="Or paste an image URL"><button type="button" class="btn" style="margin-top:8px" onclick="uploadImage('product')">Upload product photo</button><small id="uploadMsg"></small></div><div class="field wide"><label>Size chart image (optional)</label><input id="cfile" type="file" accept="image/*"><input id="ci" value="${esc(editing.size_chart_url||'')}" placeholder="Or paste a chart image URL"><button type="button" class="btn" style="margin-top:8px" onclick="uploadImage('chart')">Upload size chart</button><small id="chartMsg"></small></div><div class="field wide"><label>Description</label><textarea id="pd">${esc(editing.description||'')}</textarea></div></div><div style="margin-top:15px"><button class="btn dark" onclick="saveProduct()">Save product</button> <button class="btn" onclick="document.getElementById('productForm').remove()">Cancel</button></div></div>`)}async function uploadImage(kind){const input=document.getElementById(kind==='product'?'pfile':'cfile');const msg=document.getElementById(kind==='product'?'uploadMsg':'chartMsg');const f=input.files[0];if(!f)return null;msg.textContent=' Uploading…';try{const fd=new FormData();fd.append('file',f);fd.append('field',kind==='product'?'image_url':'size_chart_url');if(editing&&editing.id)fd.append('product_id',editing.id);const r=await fetch('/api/admin/upload',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Upload failed');document.getElementById(kind==='product'?'pi':'ci').value=j.url;if(editing&&editing.id){editing=Object.assign({},editing,j.product||{});}msg.textContent=editing&&editing.id?' Saved to product.':' Uploaded — saving product…';return j.url}catch(e){msg.textContent=' '+e.message;throw e}}async function saveProduct(){const btn=document.querySelector('#productForm .dark');if(btn)btn.disabled=true;try{if(document.getElementById('pfile').files[0])await uploadImage('product');if(document.getElementById('cfile').files[0])await uploadImage('chart');const b={id:editing.id,name:pn.value,price:Number(pp.value),stock:Number(ps.value),sizes:pz.value.split(',').map(x=>x.trim()).filter(Boolean),image_url:pi.value,size_chart_url:ci.value,description:pd.value,active:true};await call('/products',{method:editing.id?'PUT':'POST',body:JSON.stringify(b)});document.getElementById('productForm').remove();load()}catch(e){alert(e.message||'Could not save the product. Please try again.');if(btn)btn.disabled=false}}async function deleteProduct(id){if(confirm('Delete this product?')){await call('/products',{method:'DELETE',body:JSON.stringify({id})});load()}}async function updateOrder(id,status){await call('/orders',{method:'PUT',body:JSON.stringify({id,status})});load()}function newStory(){editingStory={};storyForm()}function editStory(x){editingStory=x;storyForm()}function storyForm(){document.getElementById('storyForm')?.remove();document.getElementById('adminApp').insertAdjacentHTML('afterbegin',`<div id="storyForm" style="background:#fff;padding:25px;margin-bottom:35px"><h2 style="font:500 30px 'Playfair Display'">${editingStory.id?'Edit':'Post'} customer story</h2><div class="formgrid"><div class="field"><label>Customer name</label><input id="sn" value="${esc(editingStory.customer_name||'')}" placeholder="e.g. Priya"></div><div class="field"><label>Piece worn</label><input id="sp" value="${esc(editingStory.product_name||'')}" placeholder="e.g. Sunset Breeze Dress"></div><div class="field wide"><label>Photo</label><input id="sf" type="file" accept="image/*"><input id="si" value="${esc(editingStory.image_url||'')}" placeholder="Or paste an image URL"><button type="button" class="btn" style="margin-top:8px" onclick="uploadStoryImage()">Upload photo</button><small id="storyUploadMsg"></small></div><div class="field wide"><label>Caption</label><textarea id="sc" rows="3">${esc(editingStory.caption||'')}</textarea></div></div><div style="margin-top:15px"><button class="btn dark" onclick="saveStory()">Publish story</button> <button class="btn" onclick="document.getElementById('storyForm').remove()">Cancel</button></div></div>`)}async function uploadStoryImage(){const f=document.getElementById('sf').files[0];if(!f)return;const msg=document.getElementById('storyUploadMsg');msg.textContent=' Uploading…';const fd=new FormData();fd.append('file',f);const r=await fetch('/api/admin/story-upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Upload failed');document.getElementById('si').value=j.url;msg.textContent=' Uploaded.'}async function saveStory(){try{const f=document.getElementById('sf')?.files?.[0];if(f)await uploadStoryImage();const b={id:editingStory.id,image_url:document.getElementById('si').value,customer_name:document.getElementById('sn').value,product_name:document.getElementById('sp').value,caption:document.getElementById('sc').value,active:true};if(!b.image_url)return alert('Please choose a story photo.');await call('/stories',{method:editingStory.id?'PUT':'POST',body:JSON.stringify(b)});document.getElementById('storyForm').remove();load()}catch(e){alert(e.message||'Could not publish the story.')}}async function deleteStory(id){if(confirm('Delete this customer story?')){await call('/stories',{method:'DELETE',body:JSON.stringify({id})});load()}}let editingCampaign={};function newCampaign(){editingCampaign={};campaignForm()}function editCampaign(x){editingCampaign=x;campaignForm()}function campaignForm(){document.getElementById('campaignForm')?.remove();const x=editingCampaign;document.getElementById('adminApp').insertAdjacentHTML('afterbegin',`<div id="campaignForm" style="background:#fff;padding:25px;margin-bottom:35px;border:1px solid var(--line)"><h2 style="font:500 30px 'Playfair Display'">${x.id?'Edit':'Create'} special-occasion campaign</h2><div class="formgrid"><div class="field"><label>Campaign title</label><input id="ct" value="${esc(x.title||'')}" placeholder="e.g. Festive Launch"></div><div class="field"><label>Discount code</label><input id="cc" value="${esc(x.code||'')}" placeholder="e.g. ALIVERA10"></div><div class="field wide"><label>Description</label><input id="cd" value="${esc(x.description||'')}" placeholder="What customers see"></div><div class="field"><label>Discount type</label><select id="cdi"><option value="percent" ${x.discount_type!=='fixed'?'selected':''}>Percentage</option><option value="fixed" ${x.discount_type==='fixed'?'selected':''}>Fixed ₹</option></select></div><div class="field"><label>Discount value</label><input id="cv" type="number" min="0" step="0.01" value="${x.discount_value||''}"></div><div class="field"><label>Minimum order ₹</label><input id="cm" type="number" min="0" value="${x.min_subtotal||0}"></div><div class="field"><label>Starts</label><input id="cs" type="datetime-local" value="${x.starts_at?new Date(x.starts_at).toISOString().slice(0,16):''}"></div><div class="field"><label>Ends</label><input id="ce" type="datetime-local" value="${x.ends_at?new Date(x.ends_at).toISOString().slice(0,16):''}"></div><div class="field"><label>Total uses</label><input id="cu" type="number" min="1" value="${x.max_uses||''}" placeholder="Unlimited"></div><div class="field"><label>Uses per customer</label><input id="cup" type="number" min="1" value="${x.max_uses_per_customer||''}" placeholder="Unlimited"></div><div class="field wide"><label><input id="ca" type="checkbox" ${x.active!==false?'checked':''}> Campaign active</label></div></div><div style="margin-top:15px"><button class="btn dark" onclick="saveCampaign()">Save campaign</button> <button class="btn" onclick="document.getElementById('campaignForm').remove()">Cancel</button></div></div>`)}async function saveCampaign(){const b={id:editingCampaign.id,title:ct.value,description:cd.value,code:cc.value,discount_type:cdi.value,discount_value:Number(cv.value),min_subtotal:Number(cm.value||0),starts_at:cs.value,ends_at:ce.value,max_uses:cu.value,max_uses_per_customer:cup.value,active:ca.checked};await call('/campaigns',{method:editingCampaign.id?'PUT':'POST',body:JSON.stringify(b)});document.getElementById('campaignForm').remove();load()}async function deleteCampaign(id){if(confirm('Delete this campaign?')){await call('/campaigns',{method:'DELETE',body:JSON.stringify({id})});load()}}load();</script></body></html>
