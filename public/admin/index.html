<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f5f5f4; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: rgba(191, 149, 63, 0.3); }
        .gold-bg { background-color: #bf953f; }
        .gold-hover:hover { background-color: #d4af37; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="antialiased p-4 sm:p-8">
    <div class="max-w-7xl mx-auto space-y-8">
        <div class="flex justify-between items-center border-b gold-border pb-6">
            <div>
                <h1 class="font-serif text-2xl sm:text-3xl gold-gradient font-bold">Atelier Admin Dashboard</h1>
                <p class="text-xs text-stone-400 mt-1">Logged in as <span id="admin-email-display" class="text-amber-300">checking...</span></p>
            </div>
            <a href="../index.html" class="text-xs uppercase tracking-widest text-amber-300 border gold-border px-4 py-2 bg-stone-900">Return to Storefront</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-stone-950 border gold-border p-6 space-y-4">
                <h3 class="font-serif text-lg gold-gradient">Publish New Masterpiece</h3>
                <input type="text" id="dress-name" placeholder="Dress Name" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                <input type="number" id="dress-price" placeholder="Price in INR (₹)" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                <input type="text" id="dress-image" placeholder="Image URL (Unsplash / Storage)" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                <input type="text" id="dress-sizechart" placeholder="Size Chart URL or PDF Data URL" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                <button onclick="publishDress()" class="w-full gold-bg text-black py-3 text-xs uppercase font-semibold gold-hover">Publish Dress</button>
            </div>

            <div class="lg:col-span-2 bg-stone-950 border gold-border p-6 space-y-6">
                <h3 class="font-serif text-lg gold-gradient">Client Orders & Custom Requests Management</h3>
                <div id="admin-orders-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <p class="text-xs text-stone-500">Loading incoming orders...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "hello@aliveraatelier.in";

        auth.onAuthStateChanged(user => {
            if(!user || user.email !== ADMIN_EMAIL) {
                alert("Unauthorized access. Admin privileges required.");
                window.location.href = "../index.html";
                return;
            }
            document.getElementById('admin-email-display').innerText = user.email;
            loadAdminOrders();
        });

        async function publishDress() {
            const name = document.getElementById('dress-name').value;
            const price = Number(document.getElementById('dress-price').value);
            const imageUrl = document.getElementById('dress-image').value;
            const sizeChartUrl = document.getElementById('dress-sizechart').value;

            if(!name || !price || !imageUrl) { alert("Please fill in dress name, price, and image URL."); return; }

            try {
                await db.collection("atelier_dresses").add({
                    name, price, imageUrl, sizeChartUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Dress published successfully!");
                document.getElementById('dress-name').value = '';
                document.getElementById('dress-price').value = '';
                document.getElementById('dress-image').value = '';
                document.getElementById('dress-sizechart').value = '';
            } catch(e) { alert("Error: " + e.message); }
        }

        async function loadAdminOrders() {
            const container = document.getElementById('admin-orders-list');
            try {
                const snap = await db.collection("atelier_orders").orderBy("createdAt", "desc").get();
                if(snap.empty) { container.innerHTML = `<p class="text-xs text-stone-500">No orders received yet.</p>`; return; }
                
                container.innerHTML = snap.docs.map(doc => {
                    const o = doc.data();
                    const orderId = doc.id;
                    const shortId = orderId.slice(0,6).toUpperCase();
                    const itemsText = o.items.map(i => `${i.name} (Size: ${i.size}) - ₹${i.price}`).join(', ');

                    return `
                        <div class="bg-stone-900 border gold-border p-4 text-xs space-y-3">
                            <div class="flex justify-between items-center border-b border-stone-800 pb-2">
                                <div>
                                    <span class="font-serif text-amber-200 font-bold">#ALV-${shortId}</span> — <span class="text-stone-300">${o.clientName}</span> (${o.clientPhone})
                                </div>
                                <span class="text-amber-400 font-semibold">₹${o.totalAmount}</span>
                            </div>

                            <div class="space-y-1 text-stone-300">
                                <p><strong class="text-amber-200">Email:</strong> ${o.clientEmail}</p>
                                <p><strong class="text-amber-200">Address:</strong> ${o.shippingAddress}</p>
                                <p><strong class="text-amber-200">Items:</strong> ${itemsText}</p>
                                <p><strong class="text-amber-200">Payment:</strong> ${o.paymentMethod}</p>
                                <div class="bg-stone-950 p-2.5 border gold-border mt-2">
                                    <p class="text-amber-300 uppercase text-[10px] font-bold tracking-wider">Customer Written Request / Note:</p>
                                    <p class="text-stone-100 italic mt-0.5">${o.clientNotes || 'No custom notes provided by customer.'}</p>
                                </div>
                                <p class="pt-1"><strong class="text-amber-200">Current Status:</strong> <span class="text-amber-300 font-bold">${o.status}</span></p>
                            </div>

                            <div class="flex flex-wrap gap-2 pt-2 border-t border-stone-800">
                                <button onclick="updateOrderStatus('${orderId}', 'Under Production', '${o.clientEmail}', '${o.clientName}', '${itemsText}', ${o.totalAmount})" class="bg-stone-800 border gold-border text-amber-200 px-3 py-1.5 text-[10px] uppercase font-semibold hover:bg-stone-700">Confirm Order</button>
                                <button onclick="updateOrderStatus('${orderId}', 'Refund Processed', '${o.clientEmail}', '${o.clientName}', '${itemsText}', ${o.totalAmount})" class="bg-stone-800 border border-emerald-500/40 text-emerald-300 px-3 py-1.5 text-[10px] uppercase font-semibold hover:bg-emerald-950/20">Mark Refund Processed</button>
                                <button onclick="updateOrderStatus('${orderId}', 'Request Denied', '${o.clientEmail}', '${o.clientName}', '${itemsText}', ${o.totalAmount})" class="bg-stone-800 border border-red-500/40 text-red-300 px-3 py-1.5 text-[10px] uppercase font-semibold hover:bg-red-950/20">Deny Request</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                container.innerHTML = `<p class="text-xs text-red-400">Failed to load orders.</p>`;
            }
        }

        async function updateOrderStatus(orderId, newStatus, customerEmail, customerName, itemsText, totalAmount) {
            try {
                await db.collection("atelier_orders").doc(orderId).update({ status: newStatus });
                alert(`Order status updated to: ${newStatus}`);
                loadAdminOrders();

                let sub = "";
                let body = "";
                const shortId = orderId.slice(0,6).toUpperCase();

                if(newStatus === 'Under Production') {
                    sub = `Order Confirmation #${shortId} — Alivèra Atelier`;
                    body = `Dear ${customerName},\n\nYour bespoke dress is currently under creation!\nYour selection: ${itemsText}.\nPlease confirm these details within 24 hours.\nEstimated delivery: 5-7 business days.\n\nThank you for choosing Alivèra Atelier.\nBeautiful. The way you are...`;
                } else if(newStatus === 'Refund Processed') {
                    sub = `Refund Processed: Important Information #${shortId} — Alivèra Atelier`;
                    body = `Dear ${customerName},\n\nA refund of ₹${totalAmount} for your order (${itemsText}) has been processed from hello@aliveraatelier.in and should reflect in your account within 5-7 business days.\n\nThank you for choosing Alivèra Atelier.\nBeautiful. The way you are...`;
                } else if(newStatus === 'Request Denied') {
                    sub = `Important: Order Request Denial #${shortId} — Alivèra Atelier`;
                    body = `Dear ${customerName},\n\nUnfortunately, we cannot fulfill your request for ${itemsText} at this time. We apologize for the inconvenience.\n\nThank you for choosing Alivèra Atelier.\nBeautiful. The way you are...`;
                }

                const mailtoLink = `mailto:${customerEmail}?from=hello@aliveraatelier.in&subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
                window.open(mailtoLink, '_blank');

            } catch(e) {
                alert("Error updating order status: " + e.message);
            }
        }
    </script>
</body>
</html>
