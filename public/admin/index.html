<div style="padding: 30px; font-family: sans-serif;">
    <h2>Alivèra Atelier — Admin Orders Dashboard</h2>
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
            <tr style="background: #111; color: #fff; text-align: left;">
                <th style="padding: 10px;">Order ID</th>
                <th style="padding: 10px;">Customer</th>
                <th style="padding: 10px;">Details & Custom Fit</th>
                <th style="padding: 10px;">Amount</th>
                <th style="padding: 10px;">Payment ID</th>
            </tr>
        </thead>
        <tbody id="adminOrdersTable">
            <tr><td colspan="5" style="padding: 20px; text-align: center;">Loading orders...</td></tr>
        </tbody>
    </table>
</div>

<script>
async function loadAdminOrders() {
    try {
        const res = await fetch('/api/admin/orders');
        const data = await res.json();
        const tbody = document.getElementById('adminOrdersTable');
        
        if (!data.orders || !data.orders.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center;">No orders found yet.</td></tr>';
            return;
        }

        tbody.innerHTML = data.orders.map(o => `
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 10px; font-weight: bold;">${o.orderId}</td>
                <td style="padding: 10px;">${o.clientName}<br><small>${o.phone}</small></td>
                <td style="padding: 10px;">
                    <div><b>Address:</b> ${o.full_address}, ${o.city} - ${o.pincode}</div>
                    ${o.items ? o.items.map(i => `<small>• ${i.name} (Size: ${i.size}) ${i.customFitNotes ? '<br><b>Custom Fit:</b> ' + i.customFitNotes : ''}</small>`).join('') : ''}
                </td>
                <td style="padding: 10px;">₹${o.totalAmount}</td>
                <td style="padding: 10px;"><small>${o.razorpay_payment_id || 'N/A'}</small></td>
            </tr>
        `).join('');
    } catch (err) {
        console.error("Failed to load admin orders:", err);
    }
}
loadAdminOrders();
</script>
