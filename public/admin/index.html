<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Alivèra Atelier</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; }
        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; }
        .brand { color: #d4af37; letter-spacing: 2px; font-weight: bold; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: #121212; border: 1px solid #222; padding: 25px; border-radius: 6px; margin-bottom: 30px; }
        h3 { color: #d4af37; letter-spacing: 1px; margin-top: 0; }
        label { display: block; font-size: 10px; color: #aaa; letter-spacing: 1.5px; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; font-size: 13px; }
        input:focus { border-color: #d4af37; outline: none; }
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <header>
        <div class="brand">ALIVÈRA ATELIER — ADMIN PORTAL</div>
        <button class="btn" onclick="logout()">Sign Out</button>
    </header>

    <div class="container">
        <div class="card">
            <h3>LIMITED-USE & TIME-BOUND COUPON MANAGER</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Configure discount codes restricted by maximum usage count or expiry date/time.</p>
            
            <label>COUPON CODE</label>
            <input type="text" id="coupon-code" value="LUXURY10" placeholder="e.g. FESTIVE20">
            
            <label>DISCOUNT PERCENTAGE (%)</label>
            <input type="number" id="coupon-discount" value="10" placeholder="10">

            <label>MAXIMUM NUMBER OF USERS LIMIT</label>
            <input type="number" id="coupon-limit" value="5" placeholder="5">

            <label>EXPIRY DATE & TIME</label>
            <input type="datetime-local" id="coupon-expiry">

            <button class="btn" onclick="saveCouponConfig()">Save Coupon Rule</button>
        </div>
    </div>

    <script>
        async function saveCouponConfig() {
            const code = document.getElementById('coupon-code').value;
            const discount = document.getElementById('coupon-discount').value;
            const limit = document.getElementById('coupon-limit').value;
            const expiry = document.getElementById('coupon-expiry').value;

            alert(`Coupon "${code}" (${discount}% off) saved successfully!\nLimit: ${limit} users max.\nExpires: ${expiry || 'No strict time limit'}`);
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
