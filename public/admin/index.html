<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Admin Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #050505; color: #f5f5f4; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(191, 149, 63, 0.2); margin-bottom: 30px; }
        .top-nav { display: flex; justify-content: space-between; font-size: 11px; color: #fcf6ba; text-transform: uppercase; margin-bottom: 10px; }
        .top-nav span { cursor: pointer; }
        h1 { font-family: 'Playfair Display', Georgia, serif; color: #fcf6ba; font-size: 24px; margin: 0; letter-spacing: 2px; }
        .sub-tagline { font-size: 10px; color: #a8a29e; text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }

        .admin-card { background: #0c0a09; border: 1px solid rgba(191,149,63,0.3); padding: 20px; }
        .admin-title { font-family: 'Playfair Display', Georgia, serif; color: #fcf6ba; font-size: 16px; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid rgba(191,149,63,0.2); padding-bottom: 8px; }

        .input-field { width: 100%; background: #050505; border: 1px solid rgba(191,149,63,0.4); color: #fff; padding: 10px; font-size: 12px; margin-bottom: 12px; }
        .btn-action { background: #bf953f; color: #050505; border: none; padding: 11px; font-weight: bold; font-size: 11px; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 5px; }
        
        .orders-box { background: #0c0a09; border: 1px solid rgba(191,149,63,0.3); padding: 20px; margin-top: 20px; }
        .order-item { background: #050505; border: 1px solid rgba(191,149,63,0.2); padding: 12px; margin-bottom: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="top-nav">
                <span onclick="window.location.href='../index.html'">← Back to Storefront</span>
                <span>Logged in as: hello@aliveraatelier.in</span>
            </div>
            <h1>ALIVÈRA ATELIER</h1>
            <div class="sub-tagline">ADMINISTRATION & MANAGEMENT DASHBOARD</div>
        </header>

        <div class="admin-grid">
            <!-- Upload Dress Section -->
            <div class="admin-card">
                <h3 class="admin-title">Upload Dress Collection</h3>
                <input type="text" id="adminDressName" class="input-field" placeholder="Dress Name">
                <input type="number" id="adminDressPrice" class="input-field" placeholder="Price (₹)">
                <input type="text" id="adminDressImg" class="input-field" placeholder="Dress Image URL">
                <input type="text" id="adminDressSizeChart" class="input-field" placeholder="Size Chart Image URL">
                <button class="btn-action" onclick="adminUploadNewDress()">Publish to Store</button>
            </div>

            <!-- Sale & Banner Configuration -->
            <div class="admin-card">
                <h3 class="admin-title">Sale & Banner (1897 x 412)</h3>
                <select id="adminSaleType" class="input-field">
                    <option value="type1">Type 1: First 'X' Persons (Slots)</option>
                    <option value="type2">Type 2: Date-to-Date Window</option>
                </select>
                <input type="text" id="adminPromoBanner" class="input-field" placeholder="Promo Banner URL (1897 x 412)">
                <input type="datetime-local" id="adminSaleStart" class="input-field">
                <button class="btn-action" onclick="adminSaveSaleConfig()">Configure & Start Sale Timer</button>
                <button class="btn-action" style="background:#ff6b6b; color:#fff; margin-top:8px;" onclick="adminStopSale()">Stop Sale / Restore Normal</button>
            </div>
        </div>

        <!-- Golden Scratch Card Issuer -->
        <div class="admin-card">
            <h3 class="admin-title">Issue Golden Scratch Card</h3>
            <input type="email" id="scratchCustomerEmail" class="input-field" placeholder="Customer Email Address">
            <button class="btn-action" onclick="adminIssueCard()">Generate & Send Scratch Card to Account</button>
        </div>

        <!-- Live Orders Management -->
        <div class="orders-box">
            <h3 class="admin-title">Live Customer Orders & Fulfillment</h3>
            <div id="adminOrdersContainer">
                <div style="color: #888; font-size: 12px;">No incoming customer orders found in session memory.</div>
            </div>
        </div>
    </div>

    <script>
        // Access localStorage shared between Storefront and Admin panel
        let storeProducts = JSON.parse(localStorage.getItem('alivera_products')) || [];
        let liveOrders = JSON.parse(localStorage.getItem('alivera_orders')) || [];

        function adminUploadNewDress() {
            const name = document.getElementById('adminDressName').value;
            const price = Number(document.getElementById('adminDressPrice').value);
            const image = document.getElementById('adminDressImg').value;
            const sizeChart = document.getElementById('adminDressSizeChart').value;

            if(!name || !price || !image) {
                alert('Please fill out the dress name, price, and image URL.');
                return;
            }

            storeProducts.push({ id: Date.now(), name, price, image, sizeChart });
            localStorage.setItem('alivera_products', JSON.stringify(storeProducts));
            alert('Dress successfully published to collection!');
            
            // Clear inputs
            document.getElementById('adminDressName').value = '';
            document.getElementById('adminDressPrice').value = '';
            document.getElementById('adminDressImg').value = '';
            document.getElementById('adminDressSizeChart').value = '';
        }

        function adminSaveSaleConfig() {
            const saleConfig = {
                active: true,
                type: document.getElementById('adminSaleType').value,
                bannerImg: document.getElementById('adminPromoBanner').value,
                startTime: document.getElementById('adminSaleStart').value
            };
            localStorage.setItem('alivera_sale', JSON.stringify(saleConfig));
            alert('Sale configured successfully! Timer will reflect on the main storefront.');
        }

        function adminStopSale() {
            localStorage.setItem('alivera_sale', JSON.stringify({ active: false }));
            alert('Sale stopped. Normal daily banner restored on storefront.');
        }

        function adminIssueCard() {
            const email = document.getElementById('scratchCustomerEmail').value;
            if(!email) { alert('Please enter a customer email address.'); return; }
            
            let userCards = JSON.parse(localStorage.getItem(`scratch_cards_${email}`)) || [];
            userCards.push({ code: `ALIVERA-GOLD-${Math.random().toString(36).substring(2,6).toUpperCase()}`, expiry: "Valid for 30 Days" });
            localStorage.setItem(`scratch_cards_${email}`, JSON.stringify(userCards));
            
            alert(`Golden scratch card successfully sent to ${email}!`);
            document.getElementById('scratchCustomerEmail').value = '';
        }

        function renderAdminOrders() {
            const container = document.getElementById('adminOrdersContainer');
            if(liveOrders.length === 0) {
                container.innerHTML = '<div style="color: #888; font-size: 12px;">No incoming customer orders found.</div>';
                return;
            }

            container.innerHTML = '';
            liveOrders.forEach(o => {
                container.innerHTML += `
                    <div class="order-item">
                        <strong style="color: #fcf6ba; font-size: 13px;">${o.dress} (Size: ${o.size})</strong><br>
                        <strong>Customer:</strong> ${o.customer} (${o.email}) | <strong>Phone:</strong> ${o.phone}<br>
                        <strong>Address:</strong> ${o.address}<br>
                        ${o.notes ? `<strong>Custom Notes:</strong> ${o.notes}<br>` : ''}
                        <strong>Status:</strong> <span style="color:#bf953f;" id="status_${o.id}">${o.status}</span><br>
                        <div style="margin-top: 8px; display: flex; gap: 6px;">
                            <button onclick="updateStatus(${o.id}, 'Confirmed')" style="background:green; color:#fff; border:none; padding:4px 8px; font-size:10px; cursor:pointer;">Confirm</button>
                            <button onclick="updateStatus(${o.id}, 'Denied')" style="background:orange; color:#fff; border:none; padding:4px 8px; font-size:10px; cursor:pointer;">Deny</button>
                            <button onclick="updateStatus(${o.id}, 'Cancelled')" style="background:red; color:#fff; border:none; padding:4px 8px; font-size:10px; cursor:pointer;">Cancel</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateStatus(id, newStatus) {
            liveOrders = liveOrders.map(o => o.id === id ? { ...o, status: newStatus } : o);
            localStorage.setItem('alivera_orders', JSON.stringify(liveOrders));
            renderAdminOrders();
            alert(`Order status updated to ${newStatus}`);
        }

        renderAdminOrders();
    </script>
</body>
</html>
