<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Admin Portal</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        .brand-title { font-size: 18px; letter-spacing: 3px; color: #d4af37; font-weight: bold; }
        
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        
        /* Auth Screen */
        #auth-gate { text-align: center; padding: 60px 20px; background: #121212; border: 1px solid #222; border-radius: 8px; margin-top: 40px; }
        #auth-gate h2 { color: #d4af37; letter-spacing: 2px; margin-bottom: 15px; }
        #auth-gate p { color: #aaa; font-size: 12px; margin-bottom: 25px; }

        /* Admin Content Dashboard */
        #admin-dashboard { display: none; }
        .card { background: #121212; border: 1px solid #222; border-radius: 8px; padding: 25px; margin-bottom: 30px; }
        .card h2 { color: #d4af37; font-size: 16px; letter-spacing: 2px; margin-top: 0; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; color: #aaa; letter-spacing: 1.5px; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
        
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1px; text-decoration: none; font-size: 12px; width: 100%; display: block; box-sizing: border-box; margin-top: 10px; }
        .btn:hover { background: #c59b27; }
        .btn-google { background: #fff; color: #333; border: 1px solid #ddd; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: auto; padding: 10px 25px; margin: 0 auto; }
        .btn-google:hover { background: #f1f1f1; }

        .product-list-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; border: 1px solid #222; padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
        .delete-btn { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER — ADMIN</div>
        </a>
        <button id="logout-btn" style="display:none; background:none; border:none; color:#aaa; cursor:pointer; font-size:11px; letter-spacing:1px;" onclick="auth.signOut()">SIGN OUT</button>
    </header>

    <div class="container">
        <!-- AUTH GATE (Shown if not logged in as hello@aliveraatelier.in) -->
        <div id="auth-gate">
            <h2>RESTRICTED ADMIN ACCESS</h2>
            <p>Please sign in using your official administrator credentials (hello@aliveraatelier.in).</p>
            <button class="btn btn-google" onclick="signInAdmin()">
                <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.39l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Sign In as Admin
            </button>
        </div>

        <!-- ADMIN DASHBOARD (Unlocked only for hello@aliveraatelier.in) -->
        <div id="admin-dashboard">
            <div class="card">
                <h2>PUBLISH NEW LUXURY PIECE</h2>
                <div class="form-group">
                    <label>DRESS / PIECE NAME</label>
                    <input type="text" id="prod-name" class="form-control" placeholder="e.g. Velvet Royal Gown">
                </div>
                <div class="form-group">
                    <label>PRICE (INR)</label>
                    <input type="number" id="prod-price" class="form-control" placeholder="45000">
                </div>
                <div class="form-group">
                    <label>IMAGE URL</label>
                    <input type="text" id="prod-image" class="form-control" placeholder="https://image-link.com/photo.jpg">
                </div>
                <button class="btn" onclick="publishProduct()">Publish to Live Storefront</button>
            </div>

            <div class="card">
                <h2>MANAGE CATALOGUE</h2>
                <div id="admin-product-list">
                    <p style="color: #777; font-size: 12px;">Loading catalog...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADMIN_EMAIL = "hello@aliveraatelier.in";

        async function signInAdmin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                if (result.user.email !== ADMIN_EMAIL) {
                    alert("Access Denied: " + result.user.email + " is not authorized as the admin.");
                    await auth.signOut();
                } else {
                    alert("Admin access granted!");
                }
            } catch (error) {
                alert("Sign-in error: " + error.message);
            }
        }

        // Lock/Unlock based on whether logged-in user is the admin
        auth.onAuthStateChanged(user => {
            const gate = document.getElementById('auth-gate');
            const dashboard = document.getElementById('admin-dashboard');
            const logoutBtn = document.getElementById('logout-btn');

            if (user && user.email === ADMIN_EMAIL) {
                gate.style.display = 'none';
                dashboard.style.display = 'block';
                logoutBtn.style.display = 'block';
                loadAdminCatalog();
            } else {
                if (user) {
                    // Logged in with wrong account
                    auth.signOut();
                }
                gate.style.display = 'block';
                dashboard.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        async function publishProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const image = document.getElementById('prod-image').value.trim();

            if (!name || !price || !image) {
                alert("Please fill in all product details.");
                return;
            }

            try {
                await db.collection("atelier_products").add({
                    name: name,
                    price: Number(price),
                    image: image,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Piece successfully published to the live storefront!");
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-image').value = '';
                loadAdminCatalog();
            } catch (error) {
                alert("Error publishing product: " + error.message);
            }
        }

        async function loadAdminCatalog() {
            const listEl = document.getElementById('admin-product-list');
            try {
                const snapshot = await db.collection("atelier_products").orderBy("createdAt", "desc").get();
                if (snapshot.empty) {
                    listEl.innerHTML = `<p style="color: #777; font-size: 12px;">No products published yet.</p>`;
                    return;
                }

                listEl.innerHTML = snapshot.docs.map(doc => {
                    const p = doc.data();
                    return `
                        <div class="product-list-item">
                            <span><strong>${p.name}</strong> — ₹${Number(p.price).toLocaleString('en-IN')}</span>
                            <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Remove</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                listEl.innerHTML = `<p style="color: #e74c3c; font-size: 12px;">Failed to load items.</p>`;
            }
        }

        async function deleteProduct(id) {
            if (confirm("Are you sure you want to remove this piece from the collection?")) {
                await db.collection("atelier_products").doc(id).delete();
                loadAdminCatalog();
            }
        }
    </script>
</body>
</html>
