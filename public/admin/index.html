<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Alivèra Atelier</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
        body { font-family: 'Lato', sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 20px; }
        h1, h2 { font-family: 'Cinzel', serif; color: #d4af37; }
        .container { max-width: 800px; margin: 0 auto; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #121212; border: 1px solid #d4af37; color: #d4af37; padding: 8px 14px; font-size: 10px; letter-spacing: 1px; cursor: pointer; border-radius: 4px; }
        .tab-btn.active, .tab-btn:hover { background: #d4af37; color: #0a0a0a; }
        .tab-content { display: none; background: #121212; border: 1px solid #222; padding: 20px; border-radius: 6px; }
        .tab-content.active { display: block; }
        input, select { width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid #333; color: #fff; margin-bottom: 12px; box-sizing: border-box; font-size: 11px; }
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 10px; letter-spacing: 1px; }
        .back-link { display: inline-block; color: #d4af37; text-decoration: none; margin-top: 20px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CLIENT DASHBOARD</h1>
        <div id="auth-gate" style="background:#121212; padding:20px; border:1px solid #222; border-radius:6px; margin-bottom:20px;">
            <div id="auth-status-msg" style="font-size:12px; margin-bottom:10px;">Checking authentication...</div>
            <div id="auth-form-area"></div>
        </div>

        <div id="dashboard-area" style="display:none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                <button class="tab-btn" onclick="switchTab('reviews')">My Reviews</button>
                <button class="tab-btn" onclick="switchTab('recently-viewed')">Recently Viewed</button>
                <button class="tab-btn" onclick="switchTab('profile')">Edit Profile & Language</button>
            </div>

            <div id="tab-overview" class="tab-content active">
                <h2>Welcome Patron</h2>
                <p id="user-email-display" style="font-size:12px; color:#aaa;"></p>
                <button class="btn" style="width:auto; margin-top:10px;" onclick="auth.signOut()">SIGN OUT</button>
            </div>

            <div id="tab-reviews" class="tab-content">
                <h2>My Submitted Reviews</h2>
                <div id="user-reviews-container" style="font-size:11px; color:#bbb;">Loading reviews...</div>
            </div>

            <div id="tab-recently-viewed" class="tab-content">
                <h2>Recently Viewed Pieces</h2>
                <div id="recently-viewed-container" style="font-size:11px; color:#bbb;"></div>
            </div>

            <div id="tab-profile" class="tab-content">
                <h2>Profile & Language Settings</h2>
                <label style="font-size:9px; color:#aaa;">DISPLAY NAME</label>
                <input type="text" id="profile-name-input" placeholder="Your Name">
                
                <label style="font-size:9px; color:#aaa;">PREFERRED LANGUAGE</label>
                <select id="profile-lang-select">
                    <option value="en">English</option>
                    <option value="hi">Hindi (हिंदी)</option>
                    <option value="fr">French (Français)</option>
                </select>
                <button class="btn" onclick="saveProfileSettings()">SAVE PREFERENCES</button>
            </div>
        </div>

        <a href="/" class="back-link">&larr; Return to Storefront</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function playSparkleSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.08);
                    gain.gain.setValueAtTime(0.08, now + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.08); osc.stop(now + index * 0.08 + 0.3);
                });
            } catch (e) {}
        }

        auth.onAuthStateChanged(user => {
            const statusMsg = document.getElementById('auth-status-msg');
            const formArea = document.getElementById('auth-form-area');
            const dashArea = document.getElementById('dashboard-area');

            if (user) {
                statusMsg.innerText = `Authenticated as: ${user.email}`;
                formArea.innerHTML = "";
                dashArea.style.display = 'block';
                document.getElementById('user-email-display').innerText = `Email Account: ${user.email}`;
                document.getElementById('profile-name-input').value = localStorage.getItem('alivera_user_name') || user.displayName || "";
                document.getElementById('profile-lang-select').value = localStorage.getItem('alivera_language') || "en";
            } else {
                statusMsg.innerText = "Please sign in or create an account.";
                dashArea.style.display = 'none';
                formArea.innerHTML = `
                    <input type="email" id="auth-email" placeholder="Email Address">
                    <input type="password" id="auth-password" placeholder="Password">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                        <button class="btn" onclick="handleSignIn()">SIGN IN</button>
                        <button class="btn" style="background:transparent; color:#d4af37; border:1px solid #d4af37;" onclick="handleSignUp()">SIGN UP</button>
                    </div>
                `;
            }
        });

        async function handleSignIn() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try { await auth.signInWithEmailAndPassword(email, pass); playSparkleSound(); } catch (e) { alert(e.message); }
        }

        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try { await auth.createUserWithEmailAndPassword(email, pass); playSparkleSound(); alert("Account created successfully!"); } catch (e) { alert(e.message); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'recently-viewed') loadRecentlyViewed();
            if (tabName === 'reviews') loadUserReviews();
        }

        function loadRecentlyViewed() {
            const container = document.getElementById('recently-viewed-container');
            const viewed = JSON.parse(localStorage.getItem('alivera_recently_viewed')) || [];
            if (viewed.length === 0) {
                container.innerHTML = `<p style="color:#666;">No recently viewed pieces.</p>`;
                return;
            }
            container.innerHTML = viewed.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#0a0a0a; padding:8px; border:1px solid #222; margin-bottom:6px; border-radius:4px;">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <img src="${p.image}" style="width:30px; height:30px; object-fit:cover;">
                        <span>${p.name}</span>
                    </div>
                    <span style="color:#d4af37;">₹${Number(p.price).toLocaleString('en-IN')}</span>
                </div>
            `).join('');
        }

        async function loadUserReviews() {
            const container = document.getElementById('user-reviews-container');
            const user = auth.currentUser;
            if (!user) return;
            try {
                const snap = await db.collection("atelier_reviews").where("userEmail", "==", user.email).get();
                if (snap.empty) {
                    container.innerHTML = `<p style="color:#666;">You haven't submitted any reviews yet.</p>`;
                    return;
                }
                container.innerHTML = snap.docs.map(doc => {
                    const r = doc.data();
                    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    return `<div style="background:#0a0a0a; padding:8px; border:1px solid #222; margin-bottom:6px; border-radius:4px;"><strong style="color:#d4af37;">${r.productName}</strong> - ${stars}<br>${r.reviewText}</div>`;
                }).join('');
            } catch (e) {
                container.innerHTML = `<p style="color:#e74c3c;">Error loading reviews.</p>`;
            }
        }

        function saveProfileSettings() {
            localStorage.setItem('alivera_user_name', document.getElementById('profile-name-input').value);
            localStorage.setItem('alivera_language', document.getElementById('profile-lang-select').value);
            playSparkleSound();
            alert("Preferences saved successfully!");
        }
    </script>
</body>
</html>
