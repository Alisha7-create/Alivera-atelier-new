<div class="card">
    <h2>Upload New Dress / Product</h2>
    <form id="product-form">
        <div class="form-grid">
            <div class="form-group">
                <label>Dress Name</label>
                <input type="text" id="prod-name" placeholder="e.g. Silk Evening Gown" required />
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" step="0.01" id="prod-price" placeholder="150.00" required />
            </div>
            <div class="form-group full">
                <label>Description</label>
                <textarea id="prod-desc" rows="3" placeholder="Fabric details, cut, etc." required></textarea>
            </div>
            <div class="form-group">
                <label>Dress Image File</label>
                <input type="file" id="prod-image-file" accept="image/*" required />
            </div>
            <div class="form-group">
                <label>Size Chart Image File</label>
                <input type="file" id="prod-size-file" accept="image/*" required />
            </div>
        </div>
        <button type="submit">Publish Product with Images</button>
    </form>
</div>

<script>
    document.getElementById('product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Use FormData to pack text fields and raw image files together
        const formData = new FormData();
        formData.append('name', document.getElementById('prod-name').value.trim());
        formData.append('price', document.getElementById('prod-price').value);
        formData.append('description', document.getElementById('prod-desc').value.trim());
        formData.append('image', document.getElementById('prod-image-file').files[0]);
        formData.append('size_chart', document.getElementById('prod-size-file').files[0]);

        try {
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                body: formData // Note: Do NOT set Content-Type header; browser handles multipart boundary automatically
            });
            const data = await res.json();
            if (res.ok) {
                alert('Dress and size chart uploaded successfully!');
                document.getElementById('product-form').reset();
            } else {
                alert(data.error || 'Failed to upload product.');
            }
        } catch (err) {
            alert('Network error while uploading product files.');
        }
    });
</script>            <h2>Upload New Dress / Product</h2>

                    </div>
                    <div class="form-group">
                        <label>Size Chart Details</label>
                        <input type="text" id="prod-sizes" placeholder="S, M, L, XL or custom measurements" required />
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>

                    </div>
                </div>
                <button type="submit">Publish Product</button>
            </form>
        </div>

        <!-- LIVE ORDERS SECTION -->
        <div class="card">
            <h2>Live Customer Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="6" style="text-align: center;">Loading live orders...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // 1. Handle Product Upload
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('prod-name').value.trim(),
                price: parseFloat(document.getElementById('prod-price').value),
                description: document.getElementById('prod-desc').value.trim(),
                sizes: document.getElementById('prod-sizes').value.trim(),
                image_url: document.getElementById('prod-image').value.trim()
            };

            try {
                const res = await fetch('/api/admin/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Product uploaded successfully!');
                    document.getElementById('product-form').reset();
                } else {
                    alert(data.error || 'Failed to upload product.');
                }
            } catch (err) {
                alert('Network error while uploading product.');
            }
        });

        // 2. Fetch and Live-Update Orders Every 5 Seconds
        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                if (!res.ok) return;
                const orders = await res.json();
                
                const tbody = document.getElementById('orders-table-body');
                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No orders placed yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(o => `
                    <tr>
                        #${o.id}
                        <td>${o.customer_name || o.email}</td>
                        <td>${o.items_summary || 'Custom Dress Order'}</td>
                        <td>$${o.total_price}</td>
                        <td><span class="badge">${o.status || 'Pending'}</span></td>
                        <td><button onclick="processOrder(${o.id})" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Process</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error fetching live orders', err);
            }
        }

        async function processOrder(orderId) {
            const res = await fetch(`/api/admin/orders/${orderId}/process`, { method: 'POST' });
            if (res.ok) {
                fetchOrders();
            } else {
                alert('Could not update order status.');
            }
        }

        // Run immediately and poll every 5 seconds for live updates
        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
