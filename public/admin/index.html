<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Admin Control Center — Alivèra Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030303; color: #f5f5f4; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: rgba(191, 149, 63, 0.3); }
        .gold-bg { background-color: #bf953f; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="antialiased p-6 md:p-12">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- TOP BAR -->
        <div class="flex justify-between items-center pb-6 border-b gold-border">
            <div>
                <span class="text-xs uppercase tracking-[0.25em] text-amber-400 font-semibold">Restricted Access</span>
                <h1 class="font-serif text-3xl gold-gradient mt-1">Studio Admin Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="../index.html" class="text-xs uppercase tracking-widest text-stone-400 hover:text-amber-300">View Storefront →</a>
                <button type="button" onclick="auth.signOut().then(() => window.location.href='../index.html')" class="text-xs uppercase tracking-widest text-red-400">Sign Out</button>
            </div>
        </div>

        <!-- AUTH GATE -->
        <div id="admin-auth-gate" class="bg-stone-950 border gold-border p-8 max-w-md mx-auto text-center space-y-4">
            <h3 class="font-serif text-xl text-amber-200">Admin Authentication Required</h3>
            <p class="text-xs text-stone-400">Sign in using <strong class="text-amber-400">hello@aliveraatelier.in</strong></p>
            <input type="email" id="adm-email" value="hello@aliveraatelier.in" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
            <input type="password" id="adm-pass" placeholder="Password" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
            <button type="button" onclick="adminLogin()" class="w-full gold-bg text-black py-3 text-xs uppercase font-semibold">Access Dashboard</button>
        </div>

        <!-- DASHBOARD CONTENT -->
        <div id="admin-main-content" class="hidden space-y-8">
            
            <!-- CINEMATIC 1897x412 BANNER & PROMOTION MANAGER -->
            <div class="bg-stone-950 border gold-border p-6 shadow-xl space-y-6">
                <h3 class="font-serif text-xl text-amber-200">Cinematic Banner Manager (1897 x 412) & Sale Timer</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Upload Banner Image (1897x412)</label>
                        <input type="file" id="banner-file" accept="image/*" class="w-full bg-stone-900 border gold-border p-2.5 text-xs text-stone-300 file:mr-4 file:py-1 file:px-3 file:border-0 file:text-[10px] file:font-semibold file:bg-amber-400 file:text-black">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Sale / Drop Type</label>
                        <select id="promo-type" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                            <option value="countdown">Scheduled Countdown Drop (Timer → Sale Live)</option>
                            <option value="fcfs">First-Come-First-Serve (Order Cap / Manual Stop)</option>
                            <option value="regular">Regular Daily Banner (Manual Override)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Sale Start Date & Time (12:00 AM)</label>
                        <input type="datetime-local" id="sale-start" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none text-stone-300">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Max Orders Cap (For First-Come-First-Serve)</label>
                        <input type="number" id="sale-cap" placeholder="e.g. 50" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none text-stone-300">
                    </div>
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="saveBannerPromotion()" class="gold-bg text-black px-6 py-3 text-[10px] uppercase font-semibold">Deploy Banner & Rules</button>
                    <button type="button" onclick="endSaleNow()" class="bg-red-950 text-red-400 border border-red-900 px-6 py-3 text-[10px] uppercase font-semibold">End / Cancel Sale Now</button>
                </div>
            </div>

            <!-- PUBLISH DRESS LIVE -->
            <div class="bg-stone-950 border gold-border p-6 shadow-xl">
                <h3 class="font-serif text-xl text-amber-200 mb-4">Publish Dress Live (Upload Photos)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Dress Name</label>
                        <input type="text" id="d-name" placeholder="e.g. Midnight Orchid" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Price (₹)</label>
                        <input type="number" id="d-price" placeholder="e.g. 4500" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Upload Dress Photo</label>
                        <input type="file" id="d-img-file" accept="image/*" class="w-full bg-stone-900 border gold-border p-2.5 text-xs text-stone-300 file:mr-4 file:py-1 file:px-3 file:border-0 file:text-[10px] file:font-semibold file:bg-amber-400 file:text-black">
                    </div>
                </div>
                <button type="button" onclick="publishDress()" class="mt-6 gold-bg text-black px-6 py-3 text-xs uppercase font-semibold">Publish Dress Live</button>
            </div>

            <!-- LIVE ORDERS -->
            <div class="bg-stone-950 border gold-border p-6 shadow-xl">
                <h3 class="font-serif text-xl text-amber-200 mb-4">Live Customer Orders</h3>
                <div id="admin-orders-list" class="space-y-4">
                    <p class="text-xs text-stone-500 uppercase">Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "hello@aliveraatelier.in";

        auth.onAuthStateChanged(user => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-auth-gate').classList.add('hidden');
                document.getElementById('admin-main-content').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('admin-auth-gate').classList.remove('hidden');
                document.getElementById('admin-main-content').classList.add('hidden');
            }
        });

        async function adminLogin() {
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('adm-email').value, document.getElementById('adm-pass').value);
            } catch(e) { alert(e.message); }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function saveBannerPromotion() {
            const file = document.getElementById('banner-file').files[0];
            const saleType = document.getElementById('promo-type').value;
            const startDateStr = document.getElementById('sale-start').value;
            const saleCap = document.getElementById('sale-cap').value;

            let bannerImageUrl = "";
            if (file) {
                alert("Uploading 1897x412 banner photo...");
                bannerImageUrl = await convertFileToBase64(file);
            }

            const saleStartTimestamp = startDateStr ? new Date(startDateStr).getTime() : new Date().getTime();
            const saleEndTimestamp = saleStartTimestamp + (7 * 24 * 60 * 60 * 1000); // 7 day default window

            const payload = {
                saleType,
                saleStartTimestamp,
                saleEndTimestamp,
                saleCap: saleCap || 100,
                saleActive: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (bannerImageUrl) payload.bannerImageUrl = bannerImageUrl;

            await db.collection("atelier_settings").doc("promotion_config").set(payload, { merge: true });
            alert("Banner and sale rules deployed successfully!");
        }

        async function endSaleNow() {
            await db.collection("atelier_settings").doc("promotion_config").update({ saleActive: false });
            alert("Sale ended/cancelled successfully! Banner state updated.");
        }

        async function publishDress() {
            const name = document.getElementById('d-name').value.trim();
            const price = Number(document.getElementById('d-price').value);
            const imgFile = document.getElementById('d-img-file').files[0];

            if(!name || !price || !imgFile) { alert("Please provide Dress Name, Price, and Photo."); return; }

            alert("Uploading dress photo...");
            const imageUrl = await convertFileToBase64(imgFile);

            await db.collection("atelier_dresses").add({
                name, price, imageUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Dress published live successfully!");
            document.getElementById('d-name').value = '';
            document.getElementById('d-price').value = '';
            document.getElementById('d-img-file').value = '';
        }

        async function loadOrders() {
            const container = document.getElementById('admin-orders-list');
            const snap = await db.collection("atelier_orders").orderBy("createdAt", "desc").get();
            if(snap.empty) { container.innerHTML = `<p class="text-xs text-stone-500">No orders received.</p>`; return; }
            container.innerHTML = snap.docs.map(doc => {
                const o = doc.data();
                return `
                    <div class="bg-stone-900 border gold-border p-4 text-xs space-y-2">
                        <div class="flex justify-between font-semibold text-amber-200">
                            <span>Client: ${o.clientName || 'Guest'} (${o.clientEmail || 'N/A'})</span>
                            <span>Status: ${o.status || 'Pending'}</span>
                        </div>
                        <p class="text-stone-300">Phone: ${o.phone || 'N/A'} | Address: ${o.address || 'N/A'}</p>
                        <p class="text-stone-400">Items: ${o.items ? o.items.map(i => `${i.name} (${i.size})`).join(', ') : 'No items'}</p>
                        <div class="flex gap-4 pt-2">
                            <button onclick="updateStatus('${doc.id}', 'Accepted')" class="gold-bg text-black px-4 py-1.5 font-bold uppercase">Accept</button>
                            <button onclick="updateStatus('${doc.id}', 'Declined')" class="bg-red-950 text-red-400 border border-red-900 px-4 py-1.5 font-bold uppercase">Decline</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateStatus(id, status) {
            await db.collection("atelier_orders").doc(id).update({ status });
            alert(`Order marked as ${status}`);
            loadOrders();
        }
    </script>
</body>
</html>
