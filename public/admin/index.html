<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier — Admin Master Portal</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/logo.png">

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cinzel', serif, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #121212; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        .brand-title { font-size: 18px; letter-spacing: 3px; color: #d4af37; font-weight: bold; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        
        #auth-gate { text-align: center; padding: 40px 20px; background: #121212; border: 1px solid #222; border-radius: 8px; margin-top: 40px; max-width: 400px; margin-left: auto; margin-right: auto; }
        #auth-gate h2 { color: #d4af37; letter-spacing: 2px; margin-bottom: 15px; font-size: 16px; }
        #auth-gate p { color: #aaa; font-size: 11px; margin-bottom: 20px; }

        #admin-dashboard { display: none; }
        .card { background: #121212; border: 1px solid #222; border-radius: 8px; padding: 25px; margin-bottom: 30px; }
        .card h2 { color: #d4af37; font-size: 16px; letter-spacing: 2px; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; color: #aaa; letter-spacing: 1.5px; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
        
        .btn { background: #d4af37; color: #0a0a0a; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 1px; text-decoration: none; font-size: 12px; width: 100%; display: block; box-sizing: border-box; margin-top: 10px; }
        .btn:hover { background: #c59b27; }

        .list-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; border: 1px solid #222; padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
        .action-btn { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .approve-btn { background: #2ecc71; color: #0a0a0a; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">ALIVÈRA ATELIER — MASTER ADMIN</div>
        </a>
        <div style="display: flex; gap: 20px; align-items: center;">
            <a href="/" style="color: #aaa; text-decoration: none; font-size: 11px; letter-spacing: 1px;">VIEW STOREFRONT</a>
            <button id="logout-btn" style="display:none; background:none; border:none; color:#aaa; cursor:pointer; font-size:11px; letter-spacing:1px;" onclick="auth.signOut()">SIGN OUT</button>
        </div>
    </header>

    <div class="container">
        <div id="auth-gate">
            <h2>MASTER ADMIN LOGIN</h2>
            <p>Enter your hello@aliveraatelier.in credentials.</p>
            <div class="form-group" style="text-align: left;">
                <label>ADMIN EMAIL</label>
                <input type="email" id="admin-email" class="form-control" value="hello@aliveraatelier.in">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>PASSWORD</label>
                <input type="password" id="admin-password" class="form-control" placeholder="••••••••">
            </div>
            <button class="btn" onclick="loginAdmin()">Sign In as Admin</button>
        </div>

        <div id="admin-dashboard">
            <div class="card">
                <h2>LIVE CLIENT ORDERS & STATUS CONTROL</h2>
                <div id="admin-orders-list">
                    <p style="color: #777; font-size: 12px;">Checking for incoming orders...</p>
                </div>
            </div>

            <div class="card">
                <h2>PUBLISH NEW DRESS & SIZE CHART</h2>
                <div class="form-group">
                    <label>DRESS NAME</label>
                    <input type="text" id="prod-name" class="form-control" placeholder="e.g. Imperial Silk Gown">
                </div>
                <div class="form-group">
                    <label>PRICE (INR)</label>
                    <input type="number" id="prod-price" class="form-control" placeholder="38000">
                </div>
                <div class="form-group">
                    <label>DRESS IMAGE UPLOAD</label>
                    <input type="file" id="prod-image-file" class="form-control" accept="image/*" onchange="compressAndConvertImage(this, 'prod-image', 800)">
                    <input type="hidden" id="prod-image">
                </div>
                <div class="form-group">
                    <label>SIZE CHART IMAGE UPLOAD</label>
                    <input type="file" id="chart-image-file" class="form-control" accept="image/*" onchange="compressAndConvertImage(this, 'chart-image', 800)">
                    <input type="hidden" id="chart-image">
                </div>
                <button class="btn" onclick="publishProduct()">Publish to Storefront Instantly</button>
            </div>

            <div class="card">
                <h2>PROMOTIONAL BANNER & DISCOUNT CONFIGURATOR</h2>
                <div class="form-group">
                    <label>BANNER IMAGE UPLOAD</label>
                    <input type="file" id="promo-banner-image-file" class="form-control" accept="image/*" onchange="compressAndConvertImage(this, 'promo-banner-image', 1200)">
                    <input type="hidden" id="promo-banner-image">
                </div>
                <div class="form-group">
                    <label>BANNER DISPLAY TEXT</label>
                    <input type="text" id="promo-banner-text" class="form-control" placeholder="e.g. LUXURY SPRING SALE IS LIVE — 10% OFF">
                </div>
                <button class="btn" onclick="savePromoConfig()">Save Promotion Rules & Banner</button>
            </div>

            <div class="card">
                <h2>ACTIVE CATALOGUE</h2>
                <div id="admin-product-list">
                    <p style="color: #777; font-size: 12px;">Loading catalog...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "hello@aliveraatelier.in";

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            try {
                const res = await auth.signInWithEmailAndPassword(email, password);
                if (res.user.email !== ADMIN_EMAIL) {
                    alert("Unauthorized admin account.");
                    await auth.signOut();
                } else {
                    alert("Admin access granted.");
                }
            } catch(e) { alert("Login error: " + e.message); }
        }

        auth.onAuthStateChanged(user => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('auth-gate').style.display = 'block';
                document.getElementById('admin-dashboard').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'none';
            }
        });

        function compressAndConvertImage(inputElement, targetFieldId, maxWidth = 800) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    document.getElementById(targetFieldId).value = dataUrl;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function savePromoConfig() {
            try {
                const bannerText = document.getElementById('promo-banner-text').value;
                const bannerImage = document.getElementById('promo-banner-image').value;
                const existingDoc = await db.collection("atelier_settings").doc("promo").get();
                const existingImage = existingDoc.exists ? (existingDoc.data().bannerImage || '') : '';

                await db.collection("atelier_settings").doc("promo").set({
                    bannerText,
                    bannerImage: bannerImage || existingImage
                }, { merge: true });
                alert("Promotional configuration saved successfully!");
            } catch (e) {
                alert("Error saving promo config: " + e.message);
            }
        }

        async function publishProduct() {
            try {
                const name = document.getElementById('prod-name').value.trim();
                const price = Number(document.getElementById('prod-price').value);
                const image = document.getElementById('prod-image').value;
                const sizeChart = document.getElementById('chart-image').value;

                if(!name || !price || !image) { 
                    alert("Please provide a dress name, price, and select a dress image."); 
                    return; 
                }

                await db.collection("atelier_products").add({
                    name, 
                    price, 
                    image, 
                    sizeChart: sizeChart || "", 
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Dress successfully published to storefront!");
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-image').value = '';
                document.getElementById('chart-image').value = '';
                document.getElementById('prod-image-file').value = '';
                document.getElementById('chart-image-file').value = '';
                loadAdminData();
            } catch (e) {
                alert("Publishing error: " + e.message);
            }
        }

        async function loadAdminData() {
            try {
                const promoDoc = await db.collection("atelier_settings").doc("promo").get();
                if(promoDoc.exists) {
                    const d = promoDoc.data();
                    document.getElementById('promo-banner-text').value = d.bannerText || '';
                    document.getElementById('promo-banner-image').value = d.bannerImage || '';
                }

                const ordersEl = document.getElementById('admin-orders-list');
                const ordersSnap = await db.collection("atelier_orders").orderBy("createdAt", "desc").get();
                if(ordersSnap.empty) {
                    ordersEl.innerHTML = `<p style="color: #777; font-size: 12px;">No orders placed yet.</p>`;
                } else {
                    ordersEl.innerHTML = ordersSnap.docs.map(doc => {
                        const o = doc.data();
                        const id = doc.id;
                        return `
                            <div class="list-item">
                                <div>
                                    <strong>Order #${id.slice(0,6)}</strong> — ${o.clientEmail}<br>
                                    <span style="color: #aaa;">Piece: ${o.itemName} (${o.selectedSize}) | Status: <strong>${o.status}</strong></span>
                                </div>
                                <div style="display: flex; gap: 5px;">
                                    <button class="action-btn approve-btn" onclick="updateOrderStatus('${id}', 'Confirmed & Dispatched')">Confirm</button>
                                    <button class="action-btn" onclick="updateOrderStatus('${id}', 'Declined')">Decline</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                const catEl = document.getElementById('admin-product-list');
                const catSnap = await db.collection("atelier_products").orderBy("createdAt", "desc").get();
                if(catSnap.empty) {
                    catEl.innerHTML = `<p style="color: #777; font-size: 12px;">No dresses in catalog.</p>`;
                } else {
                    catEl.innerHTML = catSnap.docs.map(doc => {
                        const p = doc.data();
                        return `
                            <div class="list-item">
                                <span><strong>${p.name}</strong> — ₹${Number(p.price).toLocaleString('en-IN')}</span>
                                <button class="action-btn" onclick="deleteProduct('${doc.id}')">Remove</button>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error("Error loading admin data:", e);
            }
        }

        async function updateOrderStatus(orderId, status) {
            await db.collection("atelier_orders").doc(orderId).update({ status });
            alert(`Order status updated to "${status}".`);
            loadAdminData();
        }

        async function deleteProduct(id) {
            if(confirm("Remove this dress?")) {
                await db.collection("atelier_products").doc(id).delete();
                loadAdminData();
            }
        }
    </script>
</body>
</html>
