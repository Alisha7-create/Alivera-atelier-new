<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alivèra Atelier | Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
    <!-- Firebase SDKs Loaded in Head -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 antialiased">

    <!-- ADMIN LOGIN GATE (Email & Password) -->
    <div id="admin-gate" class="fixed inset-0 z-50 bg-stone-950 flex items-center justify-center p-6">
        <div class="bg-white border border-stone-200 p-8 max-w-md w-full shadow-xl space-y-6">
            <h2 class="font-serif text-2xl font-medium text-center">Studio Admin Portal</h2>
            <p class="text-xs text-stone-500 uppercase tracking-wider text-center">Sign in with your administrator credentials.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-stone-600 mb-1">Admin Email</label>
                    <input type="email" id="admin-email" placeholder="contact@aliveraatelier.in" class="w-full bg-stone-50 border border-stone-300 p-3 text-xs outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-stone-600 mb-1">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" class="w-full bg-stone-50 border border-stone-300 p-3 text-xs outline-none focus:border-black">
                </div>
                <button type="button" id="btn-admin-login" class="w-full bg-stone-900 text-white py-3.5 text-xs uppercase tracking-widest font-semibold hover:bg-stone-800 transition">
                    Sign In to Studio
                </button>
            </div>

            <div class="text-center pt-2">
                <a href="../index.html" class="text-xs text-stone-400 underline uppercase tracking-widest">Return to Storefront</a>
            </div>
        </div>
    </div>

    <!-- Protected Admin Dashboard Content -->
    <div id="admin-dashboard-content" class="hidden">
        <header class="bg-stone-900 text-stone-100 py-4 px-6 border-b border-stone-800">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <span class="font-serif text-xl tracking-widest font-bold">ALIVÉRA ATELIER — SECURE ADMIN</span>
                <button type="button" id="btn-admin-signout" class="text-xs uppercase tracking-widest text-red-400 hover:text-red-300">Sign Out</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-12 space-y-12">
            <div class="bg-white border border-stone-200 p-8 shadow-sm">
                <h2 class="font-serif text-2xl font-medium mb-4">Publish Dress Live to Storefront</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <input type="text" id="dress-name" placeholder="Dress Name" class="bg-stone-50 border border-stone-300 p-3 text-xs outline-none">
                    <input type="number" id="dress-price" placeholder="Price (₹)" class="bg-stone-50 border border-stone-300 p-3 text-xs outline-none">
                    <input type="text" id="dress-image" placeholder="Image URL Link" class="bg-stone-50 border border-stone-300 p-3 text-xs outline-none">
                </div>
                <button type="button" id="btn-upload-dress" class="mt-6 bg-stone-900 text-white px-8 py-3 text-xs uppercase tracking-widest hover:bg-stone-800">Publish Live</button>
            </div>
        </main>
    </div>

    <!-- Admin Logic Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653",
            measurementId: "G-YQETZYQ3PT"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

        const ADMIN_EMAILS = ["contact@aliveraatelier.in"];

        auth.onAuthStateChanged(user => {
            if (user && ADMIN_EMAILS.includes(user.email)) {
                document.getElementById('admin-gate').classList.add('hidden');
                document.getElementById('admin-dashboard-content').classList.remove('hidden');
            } else {
                document.getElementById('admin-gate').classList.remove('hidden');
                document.getElementById('admin-dashboard-content').classList.add('hidden');
            }
        });

        async function adminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            try {
                const res = await auth.signInWithEmailAndPassword(email, password);
                if (!ADMIN_EMAILS.includes(res.user.email)) {
                    alert("Access Denied: Not an authorized administrator account.");
                    await auth.signOut();
                }
            } catch (err) { 
                alert("Admin sign-in failed: " + err.message); 
            }
        }

        async function uploadDress() {
            const name = document.getElementById('dress-name').value.trim();
            const price = document.getElementById('dress-price').value.trim();
            const imageUrl = document.getElementById('dress-image').value.trim();
            if (!name || !price || !imageUrl) { alert("Fill all fields."); return; }
            await db.collection("atelier_dresses").add({ name, price: Number(price), imageUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Dress published live!");
            document.getElementById('dress-name').value = '';
            document.getElementById('dress-price').value = '';
            document.getElementById('dress-image').value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const bindClick = (id, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('click', fn);
            };

            bindClick('btn-admin-login', adminLogin);
            bindClick('btn-admin-signout', () => auth.signOut());
            bindClick('btn-upload-dress', uploadDress);
        });

        window.adminLogin = adminLogin;
        window.uploadDress = uploadDress;
    </script>
</body>
</html>
