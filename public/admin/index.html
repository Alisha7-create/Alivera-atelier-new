<script>
        function getProducts() {
            return JSON.parse(localStorage.getItem('atelier_products') || '[]');
        }

        function saveProducts(prods) {
            try {
                localStorage.setItem('atelier_products', JSON.stringify(prods));
                window.dispatchEvent(new Event('storage'));
                localStorage.setItem('atelier_last_publish', Date.now().toString());
            } catch (e) {
                alert("Storage limit reached! Please remove an older product or use a smaller image file.");
            }
        }

        // Auto-resizes and compresses images via canvas to protect localStorage quota
        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to lightweight JPEG format at 0.7 quality balance
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    if (type === 'product') {
                        document.getElementById('prod-image').value = compressedDataUrl;
                    } else {
                        document.getElementById('prod-size-chart').value = compressedDataUrl;
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const image = document.getElementById('prod-image').value.trim();
            const sizeChart = document.getElementById('prod-size-chart').value.trim();

            if (!name || !price) {
                alert("Please provide both a product name and price.");
                return;
            }

            let products = getProducts();
            products.push({
                id: Date.now(),
                name,
                price,
                image: image || '/logo.png',
                sizeChart: sizeChart || ''
            });
            
            saveProducts(products);
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-image').value = '';
            document.getElementById('prod-size-chart').value = '';
            document.getElementById('prod-image-file').value = '';
            document.getElementById('chart-image-file').value = '';
            
            renderAdminCatalog();
            alert("Product published successfully to storefront catalog!");
        }

        function deleteProduct(idx) {
            if (confirm("Remove this design from the catalog?")) {
                let products = getProducts();
                products.splice(idx, 1);
                saveProducts(products);
                renderAdminCatalog();
            }
        }

        function renderAdminCatalog() {
            const grid = document.getElementById('admin-catalog-grid');
            let products = getProducts();
            if (products.length === 0) {
                grid.innerHTML = `<p style="color: #777; font-size: 12px;">No active products found.</p>`;
                return;
            }
            grid.innerHTML = products.map((p, idx) => `
                <div class="card-item">
                    <img src="${p.image}" alt="${p.name}" onerror="this.src='/logo.png'">
                    <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 5px;">${p.name}</div>
                    <div style="color: #d4af37; font-size: 14px; margin-bottom: 10px;">₹${Number(p.price).toLocaleString('en-IN')}</div>
                    <button class="btn" style="background: #e74c3c; color: #fff; width: 100%;" onclick="deleteProduct(${idx})">Remove Design</button>
                </div>
            `).join('');
        }

        function updateOrderStatus(index) {
            let orders = JSON.parse(localStorage.getItem('atelier_orders') || '[]');
            const selectedStatus = document.getElementById(`status-select-${index}`).value;
            const trackingId = document.getElementById(`tracking-id-${index}`).value.trim();
            const carrier = document.getElementById(`carrier-${index}`).value.trim();
            
            if (selectedStatus === 'Denied/Cancelled') {
                const reason = prompt("Enter a reason for declining/cancelling this order:");
                if (reason === null) return;
                orders[index].cancellationReason = reason;
            }

            orders[index].status = selectedStatus;
            orders[index].trackingId = trackingId;
            orders[index].carrier = carrier;

            localStorage.setItem('atelier_orders', JSON.stringify(orders));
            alert(`Order status & tracking info updated successfully!`);
            renderAdminOrders();
        }

        function renderAdminOrders() {
            const container = document.getElementById('admin-orders-list');
            let orders = JSON.parse(localStorage.getItem('atelier_orders') || '[]');
            
            if (orders.length === 0) {
                container.innerHTML = `<p style="color: #777; font-size: 12px;">No orders placed yet.</p>`;
                return;
            }

            container.innerHTML = orders.map((o, index) => `
                <div style="background: #181818; border: 1px solid #333; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: #d4af37; font-size: 13px; font-weight: bold;">Order #${o.id || 'N/A'}</span>
                        <span style="color: #fff; font-size: 12px;">Status: <strong>${o.status || 'Pending Review'}</strong></span>
                    </div>
                    <div style="font-size: 12px; color: #fff; margin-bottom: 5px;"><strong>Client:</strong> ${o.clientEmail} (${o.shipping.name}, ${o.shipping.phone})</div>
                    <div style="font-size: 12px; color: #fff; margin-bottom: 5px;"><strong>Address:</strong> ${o.shipping.address}, ${o.shipping.city}, ${o.shipping.state} - ${o.shipping.pincode}</div>
                    
                    <ul style="margin: 8px 0 10px 20px; padding: 0; font-size: 11px; color: #ccc;">
                        ${o.items.map(i => `<li>${i.quantity}x ${i.name} (${i.size}) — ${i.customNotes || ''}</li>`).join('')}
                    </ul>

                    <div style="background: #111; padding: 10px; border-radius: 4px; margin-top: 10px; border: 1px solid #222;">
                        <label style="margin-top:0;">UPDATE ORDER STATUS</label>
                        <select id="status-select-${index}" class="custom-input">
                            <option value="Pending Admin Review" ${o.status === 'Pending Admin Review' ? 'selected' : ''}>Pending Review</option>
                            <option value="Confirmed" ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                            <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="Denied/Cancelled" ${o.status === 'Denied/Cancelled' ? 'selected' : ''}>Denied/Cancelled</option>
                        </select>

                        <div style="display: flex; gap: 10px; margin-top: 8px;">
                            <div style="flex:1;">
                                <label style="margin-top:0;">TRACKING ID / WAYBILL</label>
                                <input type="text" id="tracking-id-${index}" class="custom-input" value="${o.trackingId || ''}" placeholder="e.g. TRK9847521">
                            </div>
                            <div style="flex:1;">
                                <label style="margin-top:0;">COURIER / CARRIER</label>
                                <input type="text" id="carrier-${index}" class="custom-input" value="${o.carrier || ''}" placeholder="e.g. Blue Dart / Delhivery">
                            </div>
                        </div>
                        <button class="btn" style="width: 100%; margin-top: 8px;" onclick="updateOrderStatus(${index})">Save Status & Tracking Info</button>
                    </div>
                </div>
            `).join('');
        }

        async function logout() { window.location.href = '/'; }
        renderAdminCatalog();
        renderAdminOrders();
    </script>
