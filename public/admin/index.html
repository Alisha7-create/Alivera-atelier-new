<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Admin Control Center — Alivèra Atelier</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030303; color: #f5f5f4; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: rgba(191, 149, 63, 0.3); }
        .gold-bg { background-color: #bf953f; }
        .gold-hover:hover { background-color: #d4af37; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="antialiased selection:bg-amber-400 selection:text-black min-h-screen flex flex-col">

    <header class="bg-black/95 border-b gold-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div>
                <h1 class="font-serif text-xl tracking-[0.2em] font-bold gold-gradient">ATELIER STUDIO CONTROL</h1>
                <p class="text-[10px] text-stone-400 uppercase tracking-widest">Admin Dashboard & Operations</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="../index.html" class="text-xs uppercase tracking-widest text-stone-300 hover:text-amber-300 transition border gold-border px-4 py-2">View Live Store</a>
                <button type="button" onclick="adminLogout()" class="text-xs uppercase tracking-widest text-red-400 hover:text-red-300 border border-red-500/40 px-4 py-2">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow space-y-12">
        
        <!-- SECTION 1: STOREFRONT TEXT & HERO BANNER CONFIGURATION -->
        <section class="bg-stone-950 border gold-border p-6 shadow-xl space-y-6">
            <h2 class="font-serif text-xl text-amber-200">Storefront Banner & Text Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Hero Banner Image URL (1897x412px)</label>
                        <input type="text" id="cfg-banner-url" placeholder="https://..." class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Storefront Subtitle (e.g., Tagline)</label>
                        <input type="text" id="cfg-subtitle" placeholder='"Beautiful. The way you are..."' class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-stone-400 mb-1">Storefront Description</label>
                        <textarea id="cfg-desc" rows="2" placeholder="Custom atelier description..." class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none"></textarea>
                    </div>
                </div>

                <div class="space-y-4 bg-stone-900/40 p-4 border gold-border flex flex-col justify-between">
                    <div>
                        <h3 class="font-serif text-sm text-amber-200 mb-2">Flash Sale / Promotion Control</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-[10px] uppercase text-stone-400 mb-1">Sale Type</label>
                                <select id="cfg-sale-type" class="w-full bg-stone-900 border gold-border p-2 text-xs text-stone-100 outline-none">
                                    <option value="regular">Regular Showcase</option>
                                    <option value="countdown">Countdown Timer</option>
                                    <option value="fcfs">First Come First Serve (FCFS)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase text-stone-400 mb-1">Item Limit (For FCFS)</label>
                                <input type="number" id="cfg-sale-cap" placeholder="e.g., 50" class="w-full bg-stone-900 border gold-border p-2 text-xs text-stone-100 outline-none">
                            </div>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <input type="checkbox" id="cfg-sale-active" class="w-4 h-4 accent-amber-500">
                            <label class="text-xs text-stone-300">Enable Active Sale / Status Display</label>
                        </div>
                    </div>
                    <button type="button" onclick="saveStorefrontConfig()" class="w-full gold-bg text-black py-3 text-xs uppercase font-semibold tracking-wider gold-hover">Save Storefront Settings</button>
                </div>
            </div>
        </section>

        <!-- SECTION 2: PUBLISH NEW DRESS -->
        <section class="bg-stone-950 border gold-border p-6 shadow-xl space-y-6">
            <h2 class="font-serif text-xl text-amber-200">Publish New Dress Masterpiece</h2>
            <div id="upload-status-msg" class="text-xs text-amber-400 font-semibold hidden"></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-[10px] uppercase text-stone-400 mb-1">Dress Name *</label>
                    <input type="text" id="dress-name" placeholder="e.g., Midnight Orchid" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-stone-400 mb-1">Price (INR ₹) *</label>
                    <input type="number" id="dress-price" placeholder="e.g., 12500" class="w-full bg-stone-900 border gold-border p-3 text-xs text-stone-100 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-stone-400 mb-1">Dress Portrait Image (3:4 Ratio, <300KB) *</label>
                    <input type="file" id="dress-img-file" accept="image/*" class="w-full bg-stone-900 border gold-border p-2 text-xs text-stone-300 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-[10px] uppercase text-stone-400 mb-1">Optional Size Chart (Image or PDF, <1MB)</label>
                <input type="file" id="dress-chart-file" accept="image/*,application/pdf" class="w-full bg-stone-900 border gold-border p-2 text-xs text-stone-300 outline-none max-w-md">
            </div>
            <button type="button" onclick="publishDress()" class="gold-bg text-black px-8 py-3 text-xs uppercase font-semibold tracking-wider gold-hover">Publish to Live Catalog</button>
        </section>

        <!-- SECTION 3: LIVE CATALOG MANAGEMENT -->
        <section class="bg-stone-950 border gold-border p-6 shadow-xl space-y-6">
            <h2 class="font-serif text-xl text-amber-200">Catalog Inventory Management</h2>
            <div id="admin-catalog-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <p class="text-xs text-stone-500">Loading catalog inventory...</p>
            </div>
        </section>

        <!-- SECTION 4: CLIENT ORDERS -->
        <section class="bg-stone-950 border gold-border p-6 shadow-xl space-y-6">
            <h2 class="font-serif text-xl text-amber-200">Client Orders & Production Tracking</h2>
            <div id="admin-orders-list" class="space-y-3">
                <p class="text-xs text-stone-500">Loading orders...</p>
            </div>
        </section>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAcUmpfEF0MVo8OTe87VAlZGSU2VB_7yc",
            authDomain: "alivera-atelier.firebaseapp.com",
            databaseURL: "https://alivera-atelier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alivera-atelier",
            storageBucket: "alivera-atelier.firebasestorage.app",
            messagingSenderId: "952987801898",
            appId: "1:952987801898:web:af49cb363c53584de1a653"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "hello@aliveraatelier.in";

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert("Unauthorized access. Admin privileges required.");
                window.location.href = "../index.html";
            } else {
                loadAdminData();
            }
        });

        function adminLogout() {
            auth.signOut().then(() => { window.location.href = "../index.html"; });
        }

        async function loadAdminData() {
            // Load config
            const cfgDoc = await db.collection("atelier_settings").doc("promotion_config").get();
            if(cfgDoc.exists) {
                const data = cfgDoc.data();
                document.getElementById('cfg-banner-url').value = data.bannerImageUrl || '';
                document.getElementById('cfg-subtitle').value = data.storefrontSubtitle || '';
                document.getElementById('cfg-desc').value = data.storefrontDescription || '';
                document.getElementById('cfg-sale-type').value = data.saleType || 'regular';
                document.getElementById('cfg-sale-cap').value = data.saleCap || '';
                document.getElementById('cfg-sale-active').checked = data.saleActive || false;
            }

            // Load catalog inventory
            const catalogGrid = document.getElementById('admin-catalog-grid');
            const dressSnap = await db.collection("atelier_dresses").orderBy("createdAt", "desc").get();
            if(dressSnap.empty) {
                catalogGrid.innerHTML = `<p class="text-xs text-stone-500 col-span-4">No dresses in inventory.</p>`;
            } else {
                catalogGrid.innerHTML = dressSnap.docs.map(doc => {
                    const item = doc.data();
                    return `
                        <div class="bg-stone-900 border gold-border p-3 flex flex-col justify-between text-xs space-y-2">
                            <img src="${item.imageUrl}" class="w-full h-32 object-cover border gold-border">
                            <div>
                                <h4 class="font-serif text-amber-200 font-medium truncate">${item.name}</h4>
                                <p class="text-stone-400">₹${item.price}</p>
                            </div>
                            <button onclick="deleteDress('${doc.id}')" class="w-full bg-red-950/40 border border-red-500/40 text-red-400 py-1.5 uppercase text-[10px] font-semibold hover:bg-red-900/40">Delete Dress</button>
                        </div>
                    `;
                }).join('');
            }

            // Load orders
            const ordersList = document.getElementById('admin-orders-list');
            const orderSnap = await db.collection("atelier_orders").orderBy("createdAt", "desc").get();
            if(orderSnap.empty) {
                ordersList.innerHTML = `<p class="text-xs text-stone-500">No client orders received yet.</p>`;
            } else {
                ordersList.innerHTML = orderSnap.docs.map(doc => {
                    const o = doc.data();
                    const date = o.createdAt ? new Date(o.createdAt.toDate()).toLocaleString() : 'Recent';
                    return `
                        <div class="bg-stone-900 border gold-border p-4 text-xs space-y-2">
                            <div class="flex justify-between text-amber-200 font-medium">
                                <span>Order ID: ${doc.id}</span>
                                <span class="text-amber-400 font-bold">₹${o.totalAmount}</span>
                            </div>
                            <p class="text-stone-300"><b>Client:</b> ${o.clientName} (${o.clientPhone} / ${o.clientEmail})</p>
                            <p class="text-stone-300"><b>Shipping Address:</b> ${o.shippingAddress}</p>
                            <p class="text-stone-400"><b>Payment:</b> ${o.paymentMethod} | <b>Date:</b> ${date}</p>
                            <div class="flex items-center gap-2 pt-2 border-t border-stone-800">
                                <span class="text-stone-400">Status:</span>
                                <select onchange="updateOrderStatus('${doc.id}', this.value)" class="bg-stone-950 border gold-border text-amber-300 p-1 text-[11px] outline-none">
                                    <option value="Pending Production" ${o.status === 'Pending Production' ? 'selected' : ''}>Pending Production</option>
                                    <option value="Crafting in Atelier" ${o.status === 'Crafting in Atelier' ? 'selected' : ''}>Crafting in Atelier</option>
                                    <option value="Dispatched / Shipped" ${o.status === 'Dispatched / Shipped' ? 'selected' : ''}>Dispatched / Shipped</option>
                                    <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function saveStorefrontConfig() {
            const bannerImageUrl = document.getElementById('cfg-banner-url').value;
            const storefrontSubtitle = document.getElementById('cfg-subtitle').value;
            const storefrontDescription = document.getElementById('cfg-desc').value;
            const saleType = document.getElementById('cfg-sale-type').value;
            const saleCap = document.getElementById('cfg-sale-cap').value;
            const saleActive = document.getElementById('cfg-sale-active').checked;

            try {
                await db.collection("atelier_settings").doc("promotion_config").set({
                    bannerImageUrl,
                    storefrontSubtitle,
                    storefrontDescription,
                    saleType,
                    saleCap,
                    saleActive
                }, { merge: true });
                alert("Storefront settings saved successfully!");
            } catch(e) {
                alert("Error saving settings: " + e.message);
            }
        }

        async function publishDress() {
            const name = document.getElementById('dress-name').value;
            const price = Number(document.getElementById('dress-price').value);
            const imgFile = document.getElementById('dress-img-file').files[0];
            const chartFile = document.getElementById('dress-chart-file').files[0];
            const statusMsg = document.getElementById('upload-status-msg');

            if(!name || !price || !imgFile) {
                alert("Please provide name, price, and dress image file.");
                return;
            }

            statusMsg.classList.remove('hidden');
            statusMsg.innerText = "Uploading assets...";

            try {
                const imgBase64 = await fileToBase64(imgFile);
                let chartBase64 = "";
                if(chartFile) {
                    chartBase64 = await fileToBase64(chartFile);
                }

                await db.collection("atelier_dresses").add({
                    name,
                    price,
                    imageUrl: imgBase64,
                    sizeChartUrl: chartBase64,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                statusMsg.innerText = "Dress successfully published!";
                setTimeout(() => { window.location.reload(); }, 1200);
            } catch(e) {
                statusMsg.innerText = "Error publishing dress.";
                alert("Upload failed: " + e.message);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function deleteDress(id) {
            if(confirm("Are you sure you want to delete this dress from inventory?")) {
                await db.collection("atelier_dresses").doc(id).delete();
                window.location.reload();
            }
        }

        async function updateOrderStatus(id, status) {
            await db.collection("atelier_orders").doc(id).update({ status });
            alert("Order status updated!");
        }
    </script>
</body>
</html>
